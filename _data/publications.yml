# Lab publications, rendered by _includes/publications.html.
#
# Every paper lists Sanjeev Arora as an author.
#
# `year` is the year the paper first appeared on arXiv. For a paper that is
# not on arXiv, it is the year of the earliest public version. Within a year,
# entries are ordered newest first, so add a new paper at the top of its year.

######################### 2026 #########################
ortega2026do-theorem-provers:
  title: "Do Theorem Provers Need Theorem-Proving Agents? mini-Lean-agent: A Coding-Agent Baseline for Lean"
  link: "https://arxiv.org/abs/2610.17331"
  arxiv: "2610.17331"
  venue: "MATH-AI Workshop at NeurIPS 2026"
  authors: "Tomas Ortega, Simon Park, Ayush Khaitan, Liam Fowl, Alex Kontorovich, Sanjeev Arora"
  year: 2026
  abstract: >-
    General-purpose coding agents use standard shell and file interactions, yet formal
    theorem-proving agents often rely on specialized, ad-hoc tooling. This makes it
    difficult to determine which components of theorem-proving agents provide benchmark
    gains: an improved base model, a specialized harness, a specific tool, or a combination
    of any of them. We introduce mini-Lean-agent, a deliberately minimal agent for Lean
    tasks whose only model-visible tool is bash. The model must use bash to inspect and edit
    the repository, search local libraries, invoke Lean, and manage its own intermediate
    work, while a separate trusted evaluator verifies the final artifact. We compare mini-
    Lean-agent against AxProverBase and Numina-Lean-Agent on the Putnam 2025 benchmark.
    Experiments with Gemini 3.8 Flash as the base model show that mini-Lean-agent solves
    7/12 problems at \$2 per problem limit, compared with AxProverBase's 4/12. With Astra as
    the base model, mini-Lean-agent solves 12/12 problems at an average cost of \$1.28 per
    problem. This suggests that a generic coding agent with a minimal harness can already
    achieve strong performance on Lean benchmarks. Our results motivate using mini-Lean-
    agent as a standard baseline when evaluating theorem-proving infrastructure.

singh2026agent-plasticity-measuring:
  title: "Agent Plasticity: Measuring Self-Improvement Through Experience"
  link: "https://arxiv.org/abs/2610.08902"
  arxiv: "2610.08902"
  venue: "Preprint"
  authors: "Harman Singh, Anton Bakhtin, Rulin Shao, Gabriel Synnaeve, Ilia Kulikov, Rob Fergus, Sanjeev Arora, Kurt Keutzer, Jason Weston, Anuj Mahajan, Anirudh Goyal"
  year: 2026
  project: "https://harmandotpy.github.io/agent-plasticity/"
  abstract: >-
    AI agents increasingly operate in environments where they can diagnose failures and
    improve through experience, yet existing evaluations largely measure what an agent can
    do at a fixed point in time rather than how effectively it learns. Evaluating self-
    improvement requires answering three questions: does future performance improve and
    generalize beyond the interactions that enabled learning; how efficiently are new
    capabilities acquired; and where does the self-improvement process break down? To answer
    these questions, we study self-improvement in a controlled setting where agents amortize
    past experience into reusable artifacts that are inherited by future instances. At each
    checkpoint, we measure performance on training and held-out environment interactions
    while accounting for learning cost. We introduce agent plasticity, the efficiency with
    which an agent converts experience into gains in future held-out performance. Across
    multiple environments, frontier models exhibit sharply different improvement
    trajectories despite comparable opportunities to learn. Some achieve substantial and
    persistent gains, while others remain near or below their initial performance, and gains
    within the training regime often transfer only partially to out-of-distribution
    conditions. Endpoint capability and acquisition efficiency also diverge: the agent that
    ultimately performs best need not be the one that improves most efficiently. Tracing
    failures through the improvement loop further reveals different candidate bottlenecks.
    Agents with low plasticity often fail to reuse relevant artifacts, whereas more plastic
    agents may still fail despite reusing relevant artifacts, pointing to limitations in
    artifact quality, generalization, or application. Evaluating self-improving agents
    requires measuring not only what they can do, but how effectively they become better
    through experience.

shah2026gitswarm-decentralized-compounding:
  title: "GitSwarm: Decentralized Compounding Inference"
  link: "https://arxiv.org/abs/2610.04862"
  arxiv: "2610.04862"
  venue: "Preprint"
  authors: "Vedant Shah, Ankur Samanta, Paras Dahal, Mikhail Plekhanov, Carole-Jean Wu, Scott Yih, Remi Munos, Rob Fergus, Jakob Foerster, Ruslan Salakhutdinov, Sanjeev Arora, Jason Weston, Aaron Courville, Anirudh Goyal"
  year: 2026
  abstract: >-
    Long-horizon problem solving and scientific research require computation to accumulate
    across successive attempts. Partial solutions, experimental findings, and unsuccessful
    approaches can inform later work, yet most inference-time computation is organized
    around individual trajectories or candidates rather than a persistent body of reusable
    work. We call this paradigm compounding inference: organizing inference-time computation
    so that intermediate work persists and can be inspected, extended, combined, or
    challenged by subsequent computation. We instantiate compounding inference in GitSwarm,
    an asynchronous system where homogeneous agents independently decide how to advance a
    task while collaborating through structured persistent memory. Agents explore,
    experiment, verify, refine, and synthesize previous work in a shared, branch-able Git
    repository. Atomic commits preserve intermediate artifacts, while explicit semantic
    dependencies record how later contributions build on work across branches. We evaluate
    GitSwarm on long-horizon problem solving and sustained GPU-backed experimental research.
    On IMOProofBench-Advanced, GitSwarm solves all 30 problems in one run using GPT-5.5. On
    ProgramBench, it achieves a $79.4\%$ mean score, versus $65.1\%$ for the strongest
    reported baseline under the stated budget. On three neural architecture research tasks
    (Residual Matrix Transformer, Looped Transformer, NanoChat), GitSwarm improves upon the
    starting architectures through successive experimentation. Beyond final performance, we
    measure whether computation accumulates: on ProgramBench, $94.7\%$ of contributions are
    subsequently built upon, while the selected solution's ancestry covers $82-93\%$ of the
    contribution graph. These results show that inference-time computation can accumulate
    across otherwise independent episodes, forming an evolving body of work that subsequent
    inference can reuse.

dahal2026thinking-before-thinking:
  title: "Thinking Before Thinking: Scaling Agentic Inference Through Meta-Reasoning"
  link: "https://arxiv.org/abs/2609.38147"
  arxiv: "2609.38147"
  venue: "Preprint"
  authors: "Paras Dahal, Anton Bakhtin, Taco Cohen, Zhengxing Chen, Carole-Jean Wu, Rob Fergus, Scott Yih, Gabriel Synnaeve, Ruslan Salakhutdinov, Sanjeev Arora, Jason Weston, Anirudh Goyal"
  year: 2026
  abstract: >-
    As agents take on longer and more complex problems, controlling the execution becomes a
    task in its own right. Each step in the run brings new control choices, like which
    partial work to build on, whether to start fresh, or when to stop. We introduce agentic
    meta-reasoning, an inference-time harness that makes these choices an explicit and
    structured reasoning process. Workers carry out the task-level computation, while a
    controller consolidates what the run has established, explores next options, assesses
    what each option is worth under the remaining budget, and dispatches the chosen work
    with context drawn from persistent memory. Between decisions the controller carries only
    a compact account of the run rather than replaying its full history. Our baselines span
    production coding agents and research harnesses, together with a Direct Control Agent
    using the same workers and compute budget allowance. On ProgramBench, which tests long-
    horizon agentic capability through program reconstruction, meta-reasoning achieves 71.5%
    with GPT-5.5 against 58.0% for Codex; with Opus 4.8 it achieves 67.2% against 65.5% for
    Claude Code. On the other benchmarks, spanning abstract reasoning, multi-domain long-
    horizon reasoning, and proof generation, it gains between 3.6 and 4.2 points over direct
    control, averaged across three frontier models. It keeps improving over the tested
    budget ranges where direct control plateaus, though its overhead can hurt at small
    budgets. Artifact-graph analysis reveals more reuse of earlier work, higher coverage of
    correct solutions in most settings, and nonuniform gains in final selection. These
    results indicate that spending computation on structured control becomes more important
    as agents scale to longer runs.

he2026toward-skill-native-llms:
  title: "Toward Skill-Native LLMs: Skill Entropy for Benchmarking and Training Long-Horizon Reasoning"
  link: "https://arxiv.org/abs/2608.05139"
  arxiv: "2608.05139"
  venue: "NeurIPS 2026"
  authors: "Yinghui He, Ling Yang, Jiarui Liu, Yongjin Yang, Lechen Zhang, Yingcheng Wu, Zhenfei Yin, Mengdi Wang, Sanjeev Arora"
  year: 2026
  code: "https://github.com/Gen-Verse/Skill-Entropy-RL"
  abstract: >-
    Long-horizon reasoning in recent LLMs demands that the model switch between distinct
    skills inside a reasoning chain, such as first doing a math derivation, then using the
    result to plan a schedule. We call such problems cross-skill long-horizon tasks: multi-
    step tasks whose steps require different reasoning skills and depend on earlier outputs.
    Existing benchmarks often evaluate individual skills, lacking a principled way to
    measure how well a model switches between skills. We address this gap from both the
    evaluation and training sides. We introduce Skill Entropy, a measure of the difficulty
    of switching from one skill to another. We then propose Skill^2-Bench, a benchmark of
    cross-skill long-horizon tasks built over 558 skills across 9 verifiable and open-ended
    domains. Each task is assigned a task-level skill-entropy score and grouped into three
    difficulty levels. Evaluating 8 frontier and 4 open-source models on Skill^2-Bench
    reveals a skill-switching gap: accuracy decreases on higher-entropy tasks. We then turn
    skill entropy from a benchmark scale into a training signal. We propose Skill-Entropy
    RL, an RL framework where the model predicts not only the answer at each step but also
    the skill used to produce it. The reward combines step-level correctness with a skill-
    entropy reward that measures the alignment between the model-predicted skill sequence
    and the gold skill sequence. On Qwen3-4B-Instruct and Qwen3-1.7B, Skill-Entropy RL
    improves the Skill^2-Bench score from 34.4% to 68.4% and from 14.6% to 40.1%,
    respectively, outperforming competitive baselines. The same pipeline can be applied to
    off-the-shelf training data such as OpenR1-Math, indicating that skill entropy is a
    reusable training signal. Code available at: https://github.com/Gen-Verse/Skill-Entropy-
    RL

cai2026t2mlr-transformer-with:
  title: "T²MLR: Transformer with Temporal Middle-Layer Recurrence"
  link: "https://arxiv.org/abs/2607.15178"
  arxiv: "2607.15178"
  venue: "LIT Workshop at ICLR 2026"
  authors: "Ziyang Cai, Xingyu Zhu, Yihe Dong, Yinghui He, Sanjeev Arora"
  year: 2026
  abstract: >-
    Transformer reasoning is limited by autoregressive decoding, which repeat edly
    compresses rich hidden computation through token space and makes it difficult for
    intermediate reasoning states to persist across time. We in troduce Transformers with
    Temporal Middle-Layer Recurrence (T2MLR), a transformers-based latent reasoning
    architecture that fuses a cached middle layer representation from the previous token
    directly into an earlier layer of the current token position, enabling abstract
    intermediate computation to persist across decoding steps with little inference
    overhead. Across natural-language pretraining and multi-hop reasoning finetuning, T2MLR
    consistently outperforms data- and parameter-matched Transformer base lines. Moreover,
    applying recurrence to only a localized middle-layer block (as little as 20% of the
    network) often outperforms full-layer recurrence. Im portantly, T2MLR does not require
    pretraining from scratch: retrofitting the recurrent pathway into an existing pretrained
    1.7B Transformer and briefly finetuning substantially improves math reasoning, lowering
    the barrier to practical adoption. These results suggest that effective latent reasoning
    in Transformers does not require looping over all layers as in previous works, but can
    instead emerge more strongly from targeted middle-layer recurrence.

kaur2026rethinking-on-policy-self-distillation:
  title: "Rethinking On-Policy Self-Distillation for Thinking Models"
  link: "https://arxiv.org/abs/2607.05184"
  arxiv: "2607.05184"
  venue: "NeurIPS 2026, Efficient Reasoning Workshop at COLM 2026 (Spotlight)"
  authors: "Simran Kaur, Narutatsu Ri, Yinghui He, Liam Fowl, Sanjeev Arora"
  year: 2026
  abstract: >-
    Self-distillation is a promising recipe for self-improvement in language models. In this
    setting, a model can serve as its own teacher when given privileged information, such as
    a solution to a math problem. This seems especially appealing for thinking models, which
    can use test-time reasoning to absorb the privileged information. Surprisingly, we show
    that privileged self-distillation degrades thinking models on long reasoning traces:
    across five Qwen3 and OLMo thinking models evaluated on AIME24, AIME25, and HMMT25,
    privileged-context distillation causes a relative drop of up to 17% in avg@16 accuracy.
    The degradation scales with the amount of privileged context withheld from the student
    and is most pronounced at long rollout budgets, where thinking models otherwise obtain
    their largest gains. This failure mode is not specific to self-distillation: on-policy
    distillation (OPD) improves thinking models, but privileged OPD reverses these gains.
    Our diagnostics link this failure mode to how privileged teacher context reshapes
    learning at high-entropy forking positions, where multiple continuations remain
    plausible and may lead to different reasoning paths. Privileged context lowers fork
    rates in thinking-model rollouts but not in instruction-model rollouts. This leads to an
    interesting dichotomy, where privileged context can help instruction-tuned models but
    hurts stronger thinking models. The effect is visible when the student begins a self-
    correction branch, where privileged OPD penalizes sampled reconsideration tokens that
    vanilla OPD supports. Thinking models trained with a privileged teacher produce fewer
    verification, backtracking, and hedging markers, even after length normalization. These
    findings indicate that self-distillation for strong thinking models requires attention
    to token-level signal, especially around correction and reasoning steps.

ri2026do-thinking-tokens:
  title: "Do Thinking Tokens Help with Safety?"
  link: "https://arxiv.org/abs/2606.25013"
  arxiv: "2606.25013"
  venue: "NeurIPS 2026 (Spotlight), AI4Good Workshop at ICML 2026 (Best Paper Award, Oral)"
  authors: "Narutatsu Ri, Abhishek Panigrahi, Sanjeev Arora"
  year: 2026
  code: "https://github.com/narutatsuri/lrm_safety_deliberation"
  abstract: >-
    Today's reasoning models use thinking tokens to attain stronger performance on
    benchmarks than their instruction-tuned counterparts. It is also generally believed that
    this more "deliberative" mode should improve alignment and safety, by providing the
    model a safe space to consider whether its planned answer to a request violates its
    safety principles. We present evidence that this intuition is not always correct. Across
    frontier open-weight reasoning models spanning GPT-OSS, Qwen, Olmo, and Phi families, we
    find that the eventual refusal/compliance outcome is already strongly predictable via a
    trained head on the first token's hidden representation ($0.84$-$0.95$ AUROC and
    $\sim88\%$ balanced accuracy for predicting refusal/compliance) before any visible
    thinking. The thinking process turns out to be more akin to prefix completion than to
    deliberative revision, with the final outcome rarely changing after the first $\sim20\%$
    of thinking, despite giving the appearance of deliberation at the text level ($\sim74\%$
    of text-level deliberations occur when the response distribution is already locked to
    one refusal/compliance side). We also find that existing inference-time and training-
    based safety interventions, despite being motivated by the goal of inducing
    deliberation, largely shift model behavior toward over-refusal while suppressing
    already-scarce deliberation signals. Our results suggest that safety behavior in current
    reasoning models is much less deliberative than commonly assumed, and highlight the need
    for methods that induce real safety deliberation.

chung2026goedel-architect-streamlining-formal:
  title: "Goedel-Architect: Streamlining Formal Theorem Proving with Blueprint Generation and Refinement"
  link: "https://arxiv.org/abs/2606.06468"
  arxiv: "2606.06468"
  venue: "AI for Math Workshop at ICML 2026"
  authors: "Jui-Hui Chung, Ziyang Cai, Zihao Li, Qishuo Yin, Rohit Agarwal, Simon Park, Rodrigo Porto, Narutatsu Ri, Ziran Yang, Shange Tang, Xingyu Dang, Hongzhou Lin, Mengdi Wang, Danqi Chen, Chi Jin, Liam Fowl, Sanjeev Arora"
  year: 2026
  abstract: >-
    We introduce Goedel-Architect, an agentic framework for formal theorem proving in Lean 4
    centered on blueprint generation and refinement. A blueprint is a dependency graph of
    definitions and lemmas that builds up to the main theorem. First, Goedel-Architect
    generates a blueprint of formally stated definitions and lemmas, along with declared
    dependencies. This blueprint is optionally guided by a natural language proof. Then, a
    tool-equipped Lean prover component closes each open lemma node in parallel using
    relevant dependencies. Failed lemmas in turn drive refinement of the global blueprint.
    This strategy contrasts with other mainstream approaches which use recursive lemma
    decomposition, and can inefficiently loop on dead-end strategies. Using the open-weight
    DeepSeek-V4-Flash (284B-A13B) as the backbone, Goedel-Architect attains 99.2% pass@1 on
    MiniF2F-test and 75.6% pass@1 on PutnamBench. With an optional natural-language proof
    seeding the initial blueprint on the harder problems, we additionally close the
    remaining two MiniF2F-test problems (reaching 100%), lift PutnamBench to 88.8%
    (597/672), and solve 4/6 on IMO 2025, 11/12 on Putnam 2025, and 3/6 on USAMO 2026. This
    represents state-of-the-art performance for an open-source pipeline at a price point up
    to 500x less than comparable open-source pipelines.

shang2026when-errors-can:
  title: "When Errors Can Be Beneficial: A Categorization of Imperfect Rewards for Policy Gradient"
  link: "https://arxiv.org/abs/2604.25872"
  arxiv: "2604.25872"
  venue: "Preprint"
  authors: "Shuning Shang, Hubert Strauss, Stanley Wei, Sanjeev Arora, Noam Razin"
  year: 2026
  code: "https://github.com/princeton-pli/imperfect-rewards"
  abstract: >-
    Training language models via reinforcement learning often relies on imperfect proxy
    rewards, since ground truth rewards that precisely define the intended behavior are
    rarely available. Standard metrics for assessing the quality of proxy rewards, such as
    ranking accuracy, treat incorrect rewards as strictly harmful. In this work, however, we
    highlight that not all deviations from the ground truth are equal. By theoretically
    analyzing which outputs attract probability during policy gradient optimization, we
    categorize reward errors according to their effect on the increase in ground truth
    reward. The analysis establishes that reward errors, though conventionally viewed as
    harmful, can also be benign or even beneficial by preventing the policy from stalling
    around outputs with mediocre ground truth reward. We then present two practical
    implications of our theory. First, for reinforcement learning from human feedback
    (RLHF), we develop reward model evaluation metrics that account for the harmfulness of
    reward errors. Compared to standard ranking accuracy, these metrics typically correlate
    better with the performance of a language model after RLHF, yet gaps remain in robustly
    evaluating reward models. Second, we provide insights for reward design in settings with
    verifiable rewards. A key theme underlying our results is that the effectiveness of a
    proxy reward function depends heavily on its interaction with the initial policy and
    learning algorithm.

kim2026scaling-test-time-compute:
  title: "Scaling Test-Time Compute for Agentic Coding"
  link: "https://arxiv.org/abs/2604.16529"
  arxiv: "2604.16529"
  venue: "Preprint"
  authors: "Joongwon Kim, Wannan Yang, Kelvin Niu, Hongming Zhang, Yun Zhu, Eryk Helenowski, Ruan Silva, Zhengxing Chen, Srinivasan Iyer, Manzil Zaheer, Daniel Fried, Hannaneh Hajishirzi, Sanjeev Arora, Gabriel Synnaeve, Ruslan Salakhutdinov, Anirudh Goyal"
  year: 2026
  abstract: >-
    Test-time scaling has become a powerful way to improve large language models. However,
    existing methods are best suited to short, bounded outputs that can be directly
    compared, ranked or refined. Long-horizon coding agents violate this premise: each
    attempt produces an extended trajectory of actions, observations, errors, and partial
    progress taken by the agent. In this setting, the main challenge is no longer generating
    more attempts, but representing prior experience in a form that can be effectively
    selected from and reused. We propose a test-time scaling framework for agentic coding
    based on compact representations of rollout trajectories. Our framework converts each
    rollout into a structured summary that preserves its salient hypotheses, progress, and
    failure modes while discarding low-signal trace details. This representation enables two
    complementary forms of inference-time scaling. For parallel scaling, we introduce
    Recursive Tournament Voting (RTV), which recursively narrows a population of rollout
    summaries through small-group comparisons. For sequential scaling, we adapt Parallel-
    Distill-Refine (PDR) to the agentic setting by conditioning new rollouts on summaries
    distilled from prior attempts. Our method consistently improves the performance of
    frontier coding agents across SWE-Bench Verified and Terminal-Bench v2.0. For example,
    by using our method Claude-4.5-Opus improves from 70.9% to 77.6% on SWE-Bench Verified
    (mini-SWE-agent) and 46.9% to 59.1% on Terminal-Bench v2.0 (Terminus 1). Our results
    suggest that test-time scaling for long-horizon agents is fundamentally a problem of
    representation, selection, and reuse.

he2026self-distillation-zero-self-revision:
  title: "Self-Distillation Zero: Self-Revision Turns Binary Rewards into Dense Supervision"
  link: "https://arxiv.org/abs/2604.12002"
  arxiv: "2604.12002"
  venue: "RLxF Workshop at ICML 2026 (Best Paper), AI for Math Workshop at ICML 2026 (Honorable Mention)"
  authors: "Yinghui He, Simran Kaur, Adithya Bhaskar, Yongjin Yang, Jiarui Liu, Narutatsu Ri, Liam Fowl, Abhishek Panigrahi, Danqi Chen, Sanjeev Arora"
  year: 2026
  code: "https://github.com/princeton-pli/Self-Distillation-Zero"
  abstract: >-
    Current post-training methods in verifiable settings fall into two categories.
    Reinforcement learning (RLVR) relies on binary rewards, which are broadly applicable and
    powerful, but provide only sparse supervision during training. Distillation provides
    dense token-level supervision, typically obtained from an external teacher or using
    high-quality demonstrations. Collecting such supervision can be costly or unavailable.
    We propose Self-Distillation Zero (SD-Zero), a method that is substantially more
    training sample-efficient than RL and does not require an external teacher or high-
    quality demonstrations. SD-Zero trains a single model to play two roles: a Generator,
    which produces an initial response, and a Reviser, which conditions on that response and
    its binary reward to produce an improved response. We then perform on-policy self-
    distillation to distill the reviser into the generator, using the reviser's token
    distributions conditioned on the generator's response and its reward as supervision. In
    effect, SD-Zero trains the model to transform binary rewards into dense token-level
    self-supervision. On math and code reasoning benchmarks with Qwen3-4B-Instruct and
    Olmo-3-7B-Instruct, SD-Zero improves performance by at least 10% over the base models
    and outperforms strong baselines, including Rejection Fine-Tuning (RFT), GRPO, and Self-
    Distillation Fine-Tuning (SDFT), under the same question set and training sample budget.
    Extensive ablation studies show two novel characteristics of our proposed algorithm: (a)
    token-level self-localization, where the reviser can identify the key tokens that need
    to be revised in the generator's response based on reward, and (b) iterative self-
    evolution, where the improving ability to revise answers can be distilled back into
    generation performance with regular teacher synchronization. Code:
    https://github.com/princeton-pli/Self-Distillation-Zero.

dang2026escaping-the-cognitive:
  title: "Escaping the Cognitive Well: Efficient Competition Math with Off-the-Shelf Models"
  link: "https://arxiv.org/abs/2602.16793"
  arxiv: "2602.16793"
  venue: "NeurIPS 2026 (Oral), AI for Math Workshop at ICML 2026"
  authors: "Xingyu Dang, Rohit Agarwal, Rodrigo Porto, Anirudh Goyal, Liam Fowl, Sanjeev Arora"
  year: 2026
  abstract: >-
    In the past year, custom and unreleased math reasoning models reached gold medal
    performance on the International Mathematical Olympiad (IMO). Similar performance was
    then reported using large-scale inference on publicly available models but at
    prohibitive costs (e.g., 3000 USD per problem). In this work, we present an inference
    pipeline that attains best-in-class performance on IMO-style math problems at an average
    inference cost orders of magnitude below competing methods while using only general-
    purpose off-the-shelf models. Our method relies on insights about grader failure in
    solver-grader pipelines, which we call the Cognitive Well (iterative refinement
    converging to a wrong solution that the solver as well as the pipeline's internal grader
    consider to be basically correct). Our pipeline addresses these failure modes through
    conjecture extraction, wherein candidate lemmas are isolated from generated solutions
    and independently verified alongside their negations in a fresh environment (context
    detachment). On IMO-ProofBench Advanced (PB-Adv), our pipeline achieves 67.1 percent
    performance using Gemini 3.0 Pro with an average cost per question of approximately 31
    USD. At the time of evaluation, this represented the state-of-the-art on PB-Adv among
    both public and unreleased models, and more than doubles the success rate of the next
    best publicly accessible pipeline, all at a fraction of the cost.

zhao2026algoveri-an-aligned:
  title: "AlgoVeri: An Aligned Benchmark for Verified Code Generation on Classical Algorithms"
  link: "https://arxiv.org/abs/2602.09464"
  arxiv: "2602.09464"
  venue: "ICML 2026"
  authors: "Haoyu Zhao, Ziran Yang, Jiawei Li, Deyuan He, Zenan Li, Chi Jin, Venugopal V. Veeravalli, Aarti Gupta, Sanjeev Arora"
  year: 2026
  code: "https://github.com/haoyuzhao123/algoveri"
  abstract: >-
    Vericoding refers to the generation of formally verified code from rigorous
    specifications. Recent AI models show promise in vericoding, but a unified methodology
    for cross-paradigm evaluation is lacking. Existing benchmarks test only individual
    languages/tools (e.g., Dafny, Verus, and Lean) and each covers very different tasks, so
    the performance numbers are not directly comparable. We address this gap with AlgoVeri,
    a benchmark that evaluates vericoding of $77$ classical algorithms in Dafny, Verus, and
    Lean. By enforcing identical functional contracts, AlgoVeri reveals critical capability
    gaps in verification systems. While frontier models achieve tractable success in Dafny
    ($40.3$% for Gemini-3 Flash), where high-level abstractions and SMT automation simplify
    the workflow, performance collapses under the systems-level memory constraints of Verus
    ($24.7$%) and the explicit proof construction required by Lean (7.8%). Beyond aggregate
    metrics, we uncover a sharp divergence in test-time compute dynamics: Gemini-3
    effectively utilizes iterative repair to boost performance (e.g., tripling pass rates in
    Dafny), whereas GPT-OSS saturates early. Finally, our error analysis shows that language
    design affects the refinement trajectory: while Dafny allows models to focus on logical
    correctness, Verus and Lean trap models in persistent syntactic and semantic barriers.
    All data and evaluation code can be found at https://github.com/haoyuzhao123/algoveri.

cheng2026contextual-drag-how:
  title: "Contextual Drag: How Errors in the Context Affect LLM Reasoning"
  link: "https://arxiv.org/abs/2602.04288"
  arxiv: "2602.04288"
  venue: "AI with Recursive Self-Improvement Workshop at ICLR 2026 (Best Paper)"
  authors: "Yun Cheng, Xingyu Zhu, Haoyu Zhao, Sanjeev Arora"
  year: 2026
  abstract: >-
    Central to many self-improvement pipelines for large language models (LLMs) is the
    assumption that models can improve by reflecting on past mistakes. We study a phenomenon
    termed contextual drag: the presence of failed attempts in the context biases subsequent
    generations toward structurally similar errors. Across evaluations of 11 proprietary and
    open-weight models on 8 reasoning tasks, contextual drag induces 10-20% performance
    drops, and iterative self-refinement in models with severe contextual drag can collapse
    into self-deterioration. Structural analysis using tree edit distance reveals that
    subsequent reasoning trajectories inherit structurally similar error patterns from the
    context. We demonstrate that neither external feedback nor successful self-verification
    suffices to eliminate this effect. While mitigation strategies such as fallback-behavior
    fine-tuning and context denoising yield partial improvements, they fail to fully restore
    baseline performance, positioning contextual drag as a persistent failure mode in
    current reasoning architectures.

######################### 2025 #########################
park2025how-does-rl:
  title: "How Does RL Post-training Induce Skill Composition? A Case Study on Countdown"
  link: "https://arxiv.org/abs/2512.01775"
  arxiv: "2512.01775"
  venue: "NeurIPS 2026, Efficient Reasoning Workshop at NeurIPS 2025 (Spotlight), MATH-AI Workshop at NeurIPS 2025"
  authors: "Simon Park, Simran Kaur, Sanjeev Arora"
  year: 2025
  abstract: >-
    While reinforcement learning (RL) successfully enhances reasoning in large language
    models, its role in fostering compositional generalization (the ability to synthesize
    novel skills from known components) is often conflated with mere length generalization.
    To this end, we study what RL post-training teaches about skill composition and how the
    composition structure affects the skill transfer. We focus on the Countdown task (given
    n numbers and a target, form an expression that evaluates to the target) and analyze
    model solutions as expression trees, where each subtree corresponds to a reusable
    subtask and thus can be viewed as a "skill." Tracking tree shapes and their success
    rates over training, we find: (i) out-of-distribution (OOD) generalization to larger n
    and to unseen tree shapes, indicating compositional reuse of subtasks; (ii) the order of
    skill acquisition depends upon the composition structure---models master shallow
    balanced trees (workload is balanced between subtasks) before deep unbalanced ones, with
    persistent fragility on right-heavy structures for a fixed composition depth. Our
    diagnostic reveals what is learned, in what order, and where generalization fails,
    clarifying how RL-only post-training induces OOD generalization beyond what standard
    metrics such as pass@k reveal. To study the implications of our findings for real-world
    tasks, we present a preliminary study on formal theorem proving.

yu2025on-the-impossibility:
  title: "On the Impossibility of Retrain Equivalence in Machine Unlearning"
  link: "https://arxiv.org/abs/2510.16629"
  arxiv: "2510.16629"
  venue: "Preprint"
  authors: "Jiatong Yu, Yinghui He, Anirudh Goyal, Sanjeev Arora"
  year: 2025
  project: "https://princeton-pli.github.io/impossibility-unlearning/"
  abstract: >-
    Machine unlearning seeks to selectively remove the "influence" of specific training data
    on a model's outputs. The ideal goal is Retrain Equivalence--behavior identical to a
    model trained from scratch on only the retained data. This goal was formulated for
    models trained on i.i.d. data batches, but modern pipelines often involve multi-stage
    training, with each stage having a distinct data distribution and objective. Examples
    include LLM fine-tuning for alignment, reasoning ability, etc. Our study shows via
    theory and experiments that this shift to multi-stage training introduces a fundamental
    barrier for machine unlearning. The theory indicates that the outcome of local
    unlearning--methods that only use gradients computed on the forget set--is path-
    dependent. That is, a model's behavior during unlearning is influenced by the order of
    its training stages during learning, making it impossible for path-oblivious algorithms
    to universally achieve Retrain Equivalence. We empirically demonstrate the same
    phenomenon in LLM post-training across Llama and Qwen models (1B to 14B) with gradient
    ascent, NPO, and SimNPO local unlearning algorithms. Models fine-tuned via different
    orderings of identical training stages diverge in behavior during unlearning, with the
    degradation in GSM8K accuracy after unlearning varying by over 20% across paths. We also
    observe that some learning paths consistently produce models that unlearn slowly. During
    unlearning, whether the probability mass gets squeezed into paraphrasing or alternative
    concepts is also path-dependent. These results consistently show that Retrain
    Equivalence is an ill-posed target for local unlearning algorithms, so long as the
    target models are trained in stages. In situations where access to models' training
    histories is hard, the current work calls for rethinking the definition and desiderata
    of machine unlearning.

he2025skill-targeted-adaptive-training:
  title: "Skill-Targeted Adaptive Training"
  link: "https://arxiv.org/abs/2510.10023"
  arxiv: "2510.10023"
  venue: "ICLR 2026"
  authors: "Yinghui He, Abhishek Panigrahi, Yong Lin, Sanjeev Arora"
  year: 2025
  code: "https://github.com/princeton-pli/STAT"
  abstract: >-
    Language models often show little to no improvement (i.e., "saturation") when trained
    via vanilla supervised fine-tuning (SFT) on data similar to what they saw in their
    training set (e.g., MATH). We introduce a new fine-tuning strategy, STAT, to train such
    a student model by using the metacognition ability of a stronger large language model
    (LLM) as the teacher. The teacher uses the task dataset to create a list of skills
    needed for the task, and then labels each data point with its required skills (Didolkar
    et al., 2024). By monitoring the student's answers, the teacher creates a Missing-Skill-
    Profile for the student, tracking how often they failed to apply each skill in their
    responses. We use this idea to build a modified training set in one of two ways. In
    STAT-Sel, the teacher uses an existing set of training examples but adaptively reweights
    them according to the Missing-Skill-Profile. In STAT-Syn, the teacher synthesizes
    additional examples involving missing skills. Across extensive experiments on Llama and
    Qwen models, our methods yield improvements of up to 7.5% on MATH, whereas SFT provides
    only limited gains. Furthermore, STAT enhances performance on out-of-distribution
    benchmarks (e.g., AIME24/25, AMC23, etc.) by an average of 4.6%. Crucially, we find that
    STAT is complementary to RL via GRPO (Shao et al., 2024): after the model is improved
    using STAT to address skill gaps, GRPO continues to add further gains. We conclude that
    skill-targeted adaptive training should broadly improve current training pipelines. Our
    code is available at: https://github.com/princeton-pli/STAT.

madaan2025rethinking-thinking-tokens:
  title: "Rethinking Thinking Tokens: LLMs as Improvement Operators"
  link: "https://arxiv.org/abs/2510.01123"
  arxiv: "2510.01123"
  venue: "ICML 2026"
  authors: "Lovish Madaan, Aniket Didolkar, Suchin Gururangan, John Quan, Ruan Silva, Ruslan Salakhutdinov, Manzil Zaheer, Sanjeev Arora, Anirudh Goyal"
  year: 2025
  abstract: >-
    Reasoning training incentivizes LLMs to produce long chains of thought (long CoT), which
    among other things, allows them to explore solution strategies with self-checking. This
    results in higher accuracy, but inflates context length, token/compute cost, and answer
    latency. We ask: Can current models leverage their metacognition to provide other
    combinations on this Pareto frontier, e.g., better accuracy with lower context length
    and/or latency? Abstractly, we view the model as an improvement operator on its own
    "thoughts" with a continuum of possible strategies. We identify an interesting inference
    family Parallel-Distill-Refine (PDR), which performs the following: (i) generate diverse
    drafts in parallel; (ii) distill them into a bounded, textual workspace; and (iii)
    refine conditioned on this workspace, producing an output that seeds the next round.
    Importantly, context length (hence compute cost) is controllable via degree of
    parallelism, and is no longer conflated with the total number of generated tokens. We
    report PDR instantiations of current models that give better accuracy than long CoT
    while incurring lower latency. Setting degree of parallelism to 1 yields an interesting
    subcase, Sequential Refinement (SR) (iteratively improve a single candidate answer)
    which provides performance superior to long CoT. Success of such model orchestrations
    raises the question whether further training could shift the Pareto frontier. To this
    end, we train an 8B thinking model with Reinforcement Learning (RL) to make it
    consistent with PDR as the inference method. On math tasks with verifiable answers,
    iterative pipelines surpass single-pass baselines at matched sequential budgets, with
    PDR delivering the largest gains (e.g., +11% on AIME 2024 and +9% on AIME 2025).

didolkar2025metacognitive-reuse-turning:
  title: "Metacognitive Reuse: Turning Recurring LLM Reasoning Into Concise Behaviors"
  link: "https://arxiv.org/abs/2509.13237"
  arxiv: "2509.13237"
  venue: "Preprint"
  authors: "Aniket Didolkar, Nicolas Ballas, Sanjeev Arora, Anirudh Goyal"
  year: 2025
  abstract: >-
    Large language models (LLMs) now solve multi-step problems by emitting extended chains
    of thought. During the process, they often re-derive the same intermediate steps across
    problems, inflating token usage and latency. This saturation of the context window
    leaves less capacity for exploration. We study a simple mechanism that converts
    recurring reasoning fragments into concise, reusable "behaviors" (name + instruction)
    via the model's own metacognitive analysis of prior traces. These behaviors are stored
    in a "behavior handbook" which supplies them to the model in-context at inference or
    distills them into parameters via supervised fine-tuning. This approach achieves
    improved test-time reasoning across three different settings - 1) Behavior-conditioned
    inference: Providing the LLM relevant behaviors in-context during reasoning reduces
    number of reasoning tokens by up to 46% while matching or improving baseline accuracy;
    2) Behavior-guided self-improvement: Without any parameter updates, the model improves
    its own future reasoning by leveraging behaviors from its own past problem solving
    attempts. This yields up to 10% higher accuracy than a naive critique-and-revise
    baseline; and 3) Behavior-conditioned SFT: SFT on behavior-conditioned reasoning traces
    is more effective at converting non-reasoning models into reasoning models as compared
    to vanilla SFT. Together, these results indicate that turning slow derivations into fast
    procedural hints enables LLMs to remember how to reason, not just what to conclude.

lin2025goedel-prover-v2-scaling-formal:
  title: "Goedel-Prover-V2: Scaling Formal Theorem Proving with Scaffolded Data Synthesis and Self-Correction"
  link: "https://arxiv.org/abs/2508.03613"
  arxiv: "2508.03613"
  venue: "ICLR 2026"
  authors: "Yong Lin, Shange Tang, Bohan Lyu, Ziran Yang, Jui-Hui Chung, Haoyu Zhao, Lai Jiang, Yihan Geng, Jiawei Ge, Jingruo Sun, Jiayun Wu, Jiri Gesi, Ximing Lu, David Acuna, Kaiyu Yang, Hongzhou Lin, Yejin Choi, Danqi Chen, Sanjeev Arora, Chi Jin"
  year: 2025
  code: "https://github.com/Goedel-LM/Goedel-Prover-V2"
  project: "https://blog.goedel-prover.com"
  abstract: >-
    We introduce Goedel-Prover-V2, a series of open-source language models that set a new
    state-of-the-art in automated theorem proving. Built on the standard expert iteration
    and reinforcement learning pipeline, our approach incorporates three key innovations:
    (1) Scaffolded data synthesis: We generate synthetic tasks of increasing difficulty to
    train the model to master increasingly complex theorems; (2) Verifier-guided self-
    correction: We enable the model to iteratively revise its proofs by leveraging feedback
    from the Lean compiler; (3) Model averaging: We merge model checkpoints to mitigate the
    decrease in model output diversity in later stages of training. Our small model, Goedel-
    Prover-V2-8B, reaches 84.6% pass@32 on MiniF2F and outperforms DeepSeek-Prover-V2-671B
    under the same metric, despite being 80X smaller. Our flagship model, Goedel-
    Prover-V2-32B, achieves 88.1% on MiniF2F at pass@32 in standard mode and 90.4% in self-
    correction mode, outperforming prior SOTA by a large margin. Additionally, our flagship
    model solves 86 problems on PutnamBench at pass@184, securing the first place among
    open-source models on the leaderboard, surpassing DeepSeek-Prover-V2-671B's record of
    solving 47 problems by pass@1024 with a significantly smaller model size and compute
    budget. At the time of its release (July-August 2025), Goedel-Prover-V2 achieves the
    strongest overall performance among all open-source theorem provers. It also ranks among
    the top-performing models--including closed-source systems with publicly reported
    performance--under a constrained test-time compute budget. Our models, code, and data
    are released at https://github.com/Goedel-LM/Goedel-Prover-V2.

bommasani2025advancing-science--and:
  title: "Advancing Science- and Evidence-based AI Policy"
  link: "https://arxiv.org/abs/2508.02748"
  arxiv: "2508.02748"
  venue: "Science"
  authors: "Rishi Bommasani, Sanjeev Arora, Jennifer Chayes, Yejin Choi, Mariano-Florentino Cuéllar, Li Fei-Fei, Daniel E. Ho, Dan Jurafsky, Sanmi Koyejo, Hima Lakkaraju, Arvind Narayanan, Alondra Nelson, Emma Pierson, Joelle Pineau, Scott Singer, Gaël Varoquaux, Suresh Venkatasubramanian, Ion Stoica, Percy Liang, Dawn Song"
  year: 2025
  abstract: >-
    AI policy should advance AI innovation by ensuring that its potential benefits are
    responsibly realized and widely shared. To achieve this, AI policymaking should place a
    premium on evidence: Scientific understanding and systematic analysis should inform
    policy, and policy should accelerate evidence generation. But policy outcomes reflect
    institutional constraints, political dynamics, electoral pressures, stakeholder
    interests, media environment, economic considerations, cultural contexts, and leadership
    perspectives. Adding to this complexity is the reality that the broad reach of AI may
    mean that evidence and policy are misaligned: Although some evidence and policy squarely
    address AI, much more partially intersects with AI. Well-designed policy should
    integrate evidence that reflects scientific understanding rather than hype. An
    increasing number of efforts address this problem by often either (i) contributing
    research into the risks of AI and their effective mitigation or (ii) advocating for
    policy to address these risks. This paper tackles the hard problem of how to optimize
    the relationship between evidence and policy to address the opportunities and challenges
    of increasingly powerful AI.

razin2025why-is-your:
  title: "Why is Your Language Model a Poor Implicit Reward Model?"
  link: "https://arxiv.org/abs/2507.07981"
  arxiv: "2507.07981"
  venue: "ICLR 2026, Reliable ML from Unreliable Data Workshop at NeurIPS 2025 (Best Paper Runner-up)"
  authors: "Noam Razin, Yong Lin, Jiarui Yao, Sanjeev Arora"
  year: 2025
  code: "https://github.com/princeton-pli/exrm-vs-imrm"
  abstract: >-
    Reward models are key to language model post-training and inference pipelines.
    Conveniently, recent work showed that every language model defines an implicit reward
    model (IM-RM), without requiring any architectural changes. However, such IM-RMs tend to
    generalize worse, especially out-of-distribution, compared to explicit reward models
    (EX-RMs) that apply a dedicated linear head over the hidden representations of a
    language model. The existence of a generalization gap is puzzling, as EX-RMs and IM-RMs
    are nearly identical. They can be trained using the same data, loss function, and
    language model, and differ only in how the reward is computed. Toward a fundamental
    understanding of the implicit biases underlying different reward model types, we
    investigate the root cause of this gap. Our main finding, backed by theory and
    experiments, is that IM-RMs rely more heavily on superficial token-level cues.
    Consequently, they often generalize worse than EX-RMs under token-level distribution
    shifts, as well as in-distribution. Furthermore, we provide evidence against alternative
    hypotheses for the generalization gap. Most notably, we challenge the claim that IM-RMs
    struggle in tasks where generation is harder than verification because they can operate
    both as a verifier and a generator. Overall, our results highlight that seemingly minor
    design choices can substantially impact the generalization behavior of reward models.

zheng2025livecodebench-pro-how:
  title: "LiveCodeBench Pro: How Do Olympiad Medalists Judge LLMs in Competitive Programming?"
  link: "https://arxiv.org/abs/2506.11928"
  arxiv: "2506.11928"
  venue: "NeurIPS 2025"
  authors: "Zihan Zheng, Zerui Cheng, Zeyu Shen, Shang Zhou, Kaiyuan Liu, Hansen He, Dongruixuan Li, Stanley Wei, Hangyi Hao, Jianzhu Yao, Peiyao Sheng, Zixuan Wang, Wenhao Chai, Aleksandra Korolova, Peter Henderson, Sanjeev Arora, Pramod Viswanath, Jingbo Shang, Saining Xie"
  year: 2025
  code: "https://github.com/GavinZhengOI/LiveCodeBench-Pro"
  project: "https://livecodebenchpro.com/"
  abstract: >-
    Recent reports claim that large language models (LLMs) now outperform elite humans in
    competitive programming. Drawing on knowledge from a group of medalists in international
    algorithmic contests, we revisit this claim, examining how LLMs differ from human
    experts and where limitations still remain. We introduce LiveCodeBench Pro, a benchmark
    composed of problems from Codeforces, ICPC, and IOI that are continuously updated to
    reduce the likelihood of data contamination. A team of Olympiad medalists annotates
    every problem for algorithmic categories and conducts a line-by-line analysis of failed
    model-generated submissions. Using this new data and benchmark, we find that frontier
    models still have significant limitations: without external tools, the best model
    achieves only 53% pass@1 on medium-difficulty problems and 0% on hard problems, domains
    where expert humans still excel. We also find that LLMs succeed at implementation-heavy
    problems but struggle with nuanced algorithmic reasoning and complex case analysis,
    often generating confidently incorrect justifications. High performance appears largely
    driven by implementation precision and tool augmentation, not superior reasoning.
    LiveCodeBench Pro thus highlights the significant gap to human grandmaster levels, while
    offering fine-grained diagnostics to steer future improvements in code-centric LLM
    reasoning.

zhao2025ineq-comp-benchmarking-human-intuitive:
  title: "Ineq-Comp: Benchmarking Human-Intuitive Compositional Reasoning in Automated Theorem Proving on Inequalities"
  link: "https://arxiv.org/abs/2505.12680"
  arxiv: "2505.12680"
  venue: "NeurIPS 2025 Datasets and Benchmarks Track"
  authors: "Haoyu Zhao, Yihan Geng, Shange Tang, Yong Lin, Bohan Lyu, Hongzhou Lin, Chi Jin, Sanjeev Arora"
  year: 2025
  code: "https://github.com/haoyuzhao123/leanineqcomp"
  abstract: >-
    LLM-based formal proof assistants (e.g., in Lean) hold great promise for automating
    mathematical discovery. But beyond syntactic correctness, do these systems truly
    understand mathematical structure as humans do? We investigate this question in context
    of mathematical inequalities -- specifically the prover's ability to recognize that the
    given problem simplifies by applying a known inequality such as AM/GM. Specifically, we
    are interested in their ability to do this in a compositional setting where multiple
    inequalities must be applied as part of a solution. We introduce Ineq-Comp, a benchmark
    built from elementary inequalities through systematic transformations, including
    variable duplication, algebraic rewriting, and multi-step composition. Although these
    problems remain easy for humans, we find that most provers -- including Goedel, STP, and
    Kimina-7B -- struggle significantly. DeepSeek-Prover-V2-7B shows relative robustness,
    but still suffers a 20% performance drop (pass@32). Even for DeepSeek-Prover-V2-671B
    model, the gap between compositional variants and seed problems exists, implying that
    simply scaling up the model size alone does not fully solve the compositional weakness.
    Strikingly, performance remains poor for all models even when formal proofs of the
    constituent parts are provided in context, revealing that the source of weakness is
    indeed in compositional reasoning. Our results expose a persisting gap between the
    generalization behavior of current AI provers and human mathematical intuition. All data
    and evaluation code can be found at https://github.com/haoyuzhao123/LeanIneqComp.

he2025adaptmi-adaptive-skill-based:
  title: "AdaptMI: Adaptive Skill-based In-context Math Instruction for Small Language Models"
  link: "https://arxiv.org/abs/2505.00147"
  arxiv: "2505.00147"
  venue: "COLM 2025"
  authors: "Yinghui He, Abhishek Panigrahi, Yong Lin, Sanjeev Arora"
  year: 2025
  abstract: >-
    In-context learning (ICL) allows a language model to improve its problem-solving
    capability when provided with suitable information in context. Since the choice of in-
    context information can be determined based on the problem itself, in-context learning
    is analogous to human learning from teachers in a classroom. Recent works (Didolkar et
    al., 2024a; 2024b) show that ICL performance can be improved by leveraging a frontier
    large language model's (LLM) ability to predict required skills to solve a problem,
    popularly referred to as an LLM's metacognition, and using the recommended skills to
    construct necessary in-context examples. While this skill-based strategy boosts ICL
    performance in larger models, its gains on small language models (SLMs) have been
    minimal, highlighting a performance gap in ICL capabilities. We investigate this gap and
    show that skill-based prompting can hurt SLM performance on easy questions by
    introducing unnecessary information, akin to cognitive overload. To address this, we
    introduce AdaptMI, an adaptive approach to selecting skill-based in-context Math
    Instructions for SLMs. Inspired by cognitive load theory from human pedagogy, our method
    only introduces skill-based examples when the model performs poorly. We further propose
    AdaptMI+, which adds examples targeted to the specific skills missing from the model's
    responses. On 5-shot evaluations across popular math benchmarks and five SLMs (1B--7B;
    Qwen, Llama), AdaptMI+ improves accuracy by up to 6% over naive skill-based strategies.

razin2025what-makes-a:
  title: "What Makes a Reward Model a Good Teacher? An Optimization Perspective"
  link: "https://arxiv.org/abs/2503.15477"
  arxiv: "2503.15477"
  venue: "NeurIPS 2025 (Spotlight)"
  authors: "Noam Razin, Zixuan Wang, Hubert Strauss, Stanley Wei, Jason D. Lee, Sanjeev Arora"
  year: 2025
  code: "https://github.com/princeton-pli/what-makes-good-rm"
  abstract: >-
    The success of Reinforcement Learning from Human Feedback (RLHF) critically depends on
    the quality of the reward model. However, while this quality is primarily evaluated
    through accuracy, it remains unclear whether accuracy fully captures what makes a reward
    model an effective teacher. We address this question from an optimization perspective.
    First, we prove that regardless of how accurate a reward model is, if it induces low
    reward variance, then the RLHF objective suffers from a flat landscape. Consequently,
    even a perfectly accurate reward model can lead to extremely slow optimization,
    underperforming less accurate models that induce higher reward variance. We additionally
    show that a reward model that works well for one language model can induce low reward
    variance, and thus a flat objective landscape, for another. These results establish a
    fundamental limitation of evaluating reward models solely based on accuracy or
    independently of the language model they guide. Experiments using models of up to 8B
    parameters corroborate our theory, demonstrating the interplay between reward variance,
    accuracy, and reward maximization rate. Overall, our findings highlight that beyond
    accuracy, a reward model needs to induce sufficient variance for efficient optimization.

medvedev2025weak-to-strong-generalization-even:
  title: "Weak-to-Strong Generalization Even in Random Feature Networks, Provably"
  link: "https://arxiv.org/abs/2503.02877"
  arxiv: "2503.02877"
  venue: "ICML 2025"
  authors: "Marko Medvedev, Kaifeng Lyu, Dingli Yu, Sanjeev Arora, Zhiyuan Li, Nathan Srebro"
  year: 2025
  abstract: >-
    Weak-to-Strong Generalization (Burns et al., 2024) is the phenomenon whereby a strong
    student, say GPT-4, learns a task from a weak teacher, say GPT-2, and ends up
    significantly outperforming the teacher. We show that this phenomenon does not require a
    strong learner like GPT-4. We consider student and teacher that are random feature
    models, described by two-layer networks with a random and fixed bottom layer and a
    trained top layer. A "weak" teacher, with a small number of units (i.e. random
    features), is trained on the population, and a "strong" student, with a much larger
    number of units (i.e. random features), is trained only on labels generated by the weak
    teacher. We demonstrate, prove, and understand how the student can outperform the
    teacher, even though trained only on data labeled by the teacher. We also explain how
    such weak-to-strong generalization is enabled by early stopping. Importantly, we also
    show the quantitative limits of weak-to-strong generalization in this model.

zhu2025on-the-power:
  title: "On the Power of Context-Enhanced Learning in LLMs"
  link: "https://arxiv.org/abs/2503.01821"
  arxiv: "2503.01821"
  venue: "ICML 2025 (Spotlight)"
  authors: "Xingyu Zhu, Abhishek Panigrahi, Sanjeev Arora"
  year: 2025
  abstract: >-
    We formalize a new concept for LLMs, context-enhanced learning. It involves standard
    gradient-based learning on text except that the context is enhanced with additional data
    on which no auto-regressive gradients are computed. This setting is a gradient-based
    analog of usual in-context learning (ICL) and appears in some recent works. Using a
    multi-step reasoning task, we prove in a simplified setting that context-enhanced
    learning can be exponentially more sample-efficient than standard learning when the
    model is capable of ICL. At a mechanistic level, we find that the benefit of context-
    enhancement arises from a more accurate gradient learning signal. We also experimentally
    demonstrate that it appears hard to detect or recover learning materials that were used
    in the context during training. This may have implications for data security as well as
    copyright.

lin2025goedel-prover-a-frontier:
  title: "Goedel-Prover: A Frontier Model for Open-Source Automated Theorem Proving"
  link: "https://arxiv.org/abs/2502.07640"
  arxiv: "2502.07640"
  venue: "COLM 2025"
  authors: "Yong Lin, Shange Tang, Bohan Lyu, Jiayun Wu, Hongzhou Lin, Kaiyu Yang, Jia Li, Mengzhou Xia, Danqi Chen, Sanjeev Arora, Chi Jin"
  year: 2025
  code: "https://github.com/Goedel-LM/Goedel-Prover"
  abstract: >-
    We introduce Goedel-Prover, an open-source language model that achieves state-of-the-art
    (as of April 5 2025) performance in automated formal proof generation for mathematical
    problems. A key challenge in this field is the scarcity of formalized mathematical
    statements and proofs, which we address through the following approaches. First, we
    train LLMs to convert natural language math problems from the Numina dataset to
    equivalent formal statements in Lean 4. This process creates the dataset Goedel-Pset-v1,
    which includes 1.64 million formal statements. Next, we develop a large dataset of
    formal proofs by training a series of provers. Each new prover can prove many statements
    that previous ones could not, and these new proofs are added to the training set for the
    next prover. Finally, we obtain the dataset Goedel-Pset-v1-solved, which contains proofs
    for over 800K statements from Goedel-Pset-v1. Supervised fine-tuning (SFT) of DeepSeek-
    Prover-V1.5-Base on Goedel-Pset-v1-solved (i.e., no RL) yields a Goedel-Prover-SFT that
    achieves a success rate of 57.6% (Pass@32) on miniF2F, surpassing the previous leader
    DeepSeek-Prover-V1.5-RL (trained using SFT + RL on a proprietary dataset) by 7.6%. On
    PutnamBench, Goedel-Prover-SFT successfully solves 7 problems (Pass@512), ranking first
    on the leaderboard. We provide extensive discussion of our training methodology,
    highlighting the key design choices that contribute to Goedel-Prover's strong
    performance. Further RL training (including DPO) improves Goedel-Prover-SFT's success
    rate to over 60% (Pass@32) on miniF2F. To aid future research, we provide extensive
    discussion of our training methodology and design choices. We also fully open-source our
    codes, models, and datasets. Additionally, we open-source formal proofs for 29.7K
    problems in Lean Workbook, nearly doubling the 15.7K solved by prior provers.

wu2025unrealized-expectations-comparing:
  title: "Unrealized Expectations: Comparing AI Methods vs Classical Algorithms for Maximum Independent Set"
  link: "https://arxiv.org/abs/2502.03669"
  arxiv: "2502.03669"
  venue: "TMLR"
  authors: "Yikai Wu, Haoyu Zhao, Sanjeev Arora"
  year: 2025
  abstract: >-
    AI methods, such as generative models and reinforcement learning, have recently been
    applied to combinatorial optimization (CO) problems, especially NP-hard ones. This paper
    compares such GPU-based methods with classical CPU-based methods on the Maximum
    Independent Set (MIS) problem. Strikingly, even on in-distribution random graphs,
    leading AI-inspired methods are consistently outperformed by the state-of-the-art
    classical solver KaMIS running on a single CPU, and some AI-inspired methods frequently
    fail to surpass even the simplest degree-based greedy heuristic. Even with post-
    processing techniques like local search, AI-inspired methods still perform worse than
    CPU-based solvers. To better understand the source of these failures, we introduce a
    novel analysis, serialization, which reveals that non-backtracking AI-inspired methods,
    e.g. LTFT (which is based on GFlowNets), end up reasoning similarly to the simplest
    degree-based greedy, and thus worse than KaMIS. More generally, our findings suggest a
    need for a rethinking of current approaches in AI for CO, advocating for more rigorous
    benchmarking and the principled integration of classical heuristics. Additionally, we
    also find that CPU-based algorithm KaMIS have strong performance on sparse random
    graphs, which appears to show that the shattering threshold conjecture for large
    independent sets proposed by Coja-Oghlan & Efthymiou (2015) does not apply for real-life
    sizes (such as 10^6 nodes).

park2025generalizing-from-simple:
  title: "Generalizing from SIMPLE to HARD Visual Reasoning: Can We Mitigate Modality Imbalance in VLMs?"
  link: "https://arxiv.org/abs/2501.02669"
  arxiv: "2501.02669"
  venue: "ICML 2025"
  authors: "Simon Park, Abhishek Panigrahi, Yun Cheng, Dingli Yu, Anirudh Goyal, Sanjeev Arora"
  year: 2025
  code: "https://github.com/princeton-pli/vlm_s2h"
  abstract: >-
    Vision Language Models (VLMs) are impressive at visual question answering and image
    captioning. But they underperform on multi-step visual reasoning -- even compared to
    LLMs on the same tasks presented in text form -- giving rise to perceptions of modality
    imbalance or brittleness. Towards a systematic study of such issues, we introduce a
    synthetic framework for assessing the ability of VLMs to perform algorithmic visual
    reasoning, comprising three tasks: Table Readout, Grid Navigation, and Visual Analogy.
    Each has two levels of difficulty, SIMPLE and HARD, and even the SIMPLE versions are
    difficult for frontier VLMs. We propose strategies for training on the SIMPLE version of
    tasks that improve performance on the corresponding HARD task, i.e., simple-to-hard
    (S2H) generalization. This controlled setup, where each task also has an equivalent
    text-only version, allows a quantification of the modality imbalance and how it is
    impacted by training strategy. We show that 1) explicit image-to-text conversion is
    important in promoting S2H generalization on images, by transferring reasoning from
    text; 2) conversion can be internalized at test time. We also report results of
    mechanistic study of this phenomenon. We identify measures of gradient alignment that
    can identify training strategies that promote better S2H generalization. Ablations
    highlight the importance of chain-of-thought.

######################### 2024 #########################
wei2024provable-unlearning-in:
  title: "Provable Unlearning in Topic Modeling and Downstream Tasks"
  link: "https://arxiv.org/abs/2411.12600"
  arxiv: "2411.12600"
  venue: "ICLR 2025"
  authors: "Stanley Wei, Sadhika Malladi, Sanjeev Arora, Amartya Sanyal"
  year: 2024
  abstract: >-
    Machine unlearning algorithms are increasingly important as legal concerns arise around
    the provenance of training data, but verifying the success of unlearning is often
    difficult. Provable guarantees for unlearning are often limited to supervised learning
    settings. In this paper, we provide the first theoretical guarantees for unlearning in
    the pre-training and fine-tuning paradigm by studying topic models, simple bag-of-words
    language models that can be adapted to solve downstream tasks like retrieval and
    classification. First, we design a provably effective unlearning algorithm for topic
    models that incurs a computational overhead independent of the size of the original
    dataset. Our analysis additionally quantifies the deletion capacity of the model --
    i.e., the number of examples that can be unlearned without incurring a significant cost
    in model performance. Finally, we formally extend our analyses to account for adaptation
    to a given downstream task. In particular, we design an efficient algorithm to perform
    unlearning after fine-tuning the topic model via a linear head. Notably, we show that it
    is easier to unlearn pre-training data from models that have been fine-tuned to a
    particular task, and one can unlearn this data without modifying the base model.

razin2024unintentional-unalignment:
  title: "Unintentional Unalignment: Likelihood Displacement in Direct Preference Optimization"
  link: "https://arxiv.org/abs/2410.08847"
  arxiv: "2410.08847"
  venue: "ICLR 2025, FITML Workshop at NeurIPS 2024, ATTRIB Workshop at NeurIPS 2024"
  authors: "Noam Razin, Sadhika Malladi, Adithya Bhaskar, Danqi Chen, Sanjeev Arora, Boris Hanin"
  year: 2024
  code: "https://github.com/princeton-nlp/unintentional-unalignment"
  abstract: >-
    Direct Preference Optimization (DPO) and its variants are increasingly used for aligning
    language models with human preferences. Although these methods are designed to teach a
    model to generate preferred responses more frequently relative to dispreferred
    responses, prior work has observed that the likelihood of preferred responses often
    decreases during training. The current work sheds light on the causes and implications
    of this counter-intuitive phenomenon, which we term likelihood displacement. We
    demonstrate that likelihood displacement can be catastrophic, shifting probability mass
    from preferred responses to responses with an opposite meaning. As a simple example,
    training a model to prefer $\texttt{No}$ over $\texttt{Never}$ can sharply increase the
    probability of $\texttt{Yes}$. Moreover, when aligning the model to refuse unsafe
    prompts, we show that such displacement can unintentionally lead to unalignment, by
    shifting probability mass from preferred refusal responses to harmful responses (e.g.,
    reducing the refusal rate of Llama-3-8B-Instruct from 74.4% to 33.4%). We theoretically
    characterize that likelihood displacement is driven by preferences that induce similar
    embeddings, as measured by a centered hidden embedding similarity (CHES) score.
    Empirically, the CHES score enables identifying which training samples contribute most
    to likelihood displacement in a given dataset. Filtering out these samples effectively
    mitigated unintentional unalignment in our experiments. More broadly, our results
    highlight the importance of curating data with sufficiently distinct preferences, for
    which we believe the CHES score may prove valuable.

zhao2024can-models-learn:
  title: "Can Models Learn Skill Composition from Examples?"
  link: "https://arxiv.org/abs/2409.19808"
  arxiv: "2409.19808"
  venue: "NeurIPS 2024"
  authors: "Haoyu Zhao, Simran Kaur, Dingli Yu, Anirudh Goyal, Sanjeev Arora"
  year: 2024
  abstract: >-
    As large language models (LLMs) become increasingly advanced, their ability to exhibit
    compositional generalization -- the capacity to combine learned skills in novel ways not
    encountered during training -- has garnered significant attention. This type of
    generalization, particularly in scenarios beyond training data, is also of great
    interest in the study of AI safety and alignment. A recent study introduced the SKILL-
    MIX evaluation, where models are tasked with composing a short paragraph demonstrating
    the use of a specified $k$-tuple of language skills. While small models struggled with
    composing even with $k=3$, larger models like GPT-4 performed reasonably well with $k=5$
    and $6$. In this paper, we employ a setup akin to SKILL-MIX to evaluate the capacity of
    smaller models to learn compositional generalization from examples. Utilizing a diverse
    set of language skills -- including rhetorical, literary, reasoning, theory of mind, and
    common sense -- GPT-4 was used to generate text samples that exhibit random subsets of
    $k$ skills. Subsequent fine-tuning of 7B and 13B parameter models on these combined
    skill texts, for increasing values of $k$, revealed the following findings: (1) Training
    on combinations of $k=2$ and $3$ skills results in noticeable improvements in the
    ability to compose texts with $k=4$ and $5$ skills, despite models never having seen
    such examples during training. (2) When skill categories are split into training and
    held-out groups, models significantly improve at composing texts with held-out skills
    during testing despite having only seen training skills during fine-tuning, illustrating
    the efficacy of the training approach even with previously unseen skills. This study
    also suggests that incorporating skill-rich (potentially synthetic) text into training
    can substantially enhance the compositional capabilities of models.

kaur2024instruct-skillmix-a-powerful:
  title: "Instruct-SkillMix: A Powerful Pipeline for LLM Instruction Tuning"
  link: "https://arxiv.org/abs/2408.14774"
  arxiv: "2408.14774"
  venue: "ICLR 2025, Compositional Learning Workshop at NeurIPS 2024 (Oral), FITML Workshop at NeurIPS 2024"
  authors: "Simran Kaur, Simon Park, Anirudh Goyal, Sanjeev Arora"
  year: 2024
  code: "https://github.com/princeton-pli/Instruct-SkillMix"
  abstract: >-
    We introduce Instruct-SkillMix, an automated approach for creating diverse, high quality
    SFT data for instruction-following. The pipeline involves two stages, each leveraging an
    existing powerful LLM: (1) Skill extraction: uses the LLM to extract core "skills" for
    instruction-following by directly prompting the model. This is inspired by ``LLM
    metacognition'' of Didolkar et al. (2024); (2) Data generation: uses the powerful LLM to
    generate (instruction, response) data that exhibit a randomly chosen pair of these
    skills. Here, the use of random skill combinations promotes diversity and difficulty.
    The estimated cost of creating the dataset is under $600. Vanilla SFT (i.e., no PPO,
    DPO, or RL methods) on data generated from Instruct-SkillMix leads to strong gains on
    instruction following benchmarks such as AlpacaEval 2.0, MT-Bench, and WildBench. With
    just 4K examples, LLaMA-3-8B-Base achieves 42.76% length-controlled win rate on
    AlpacaEval 2.0, a level similar to frontier models like Claude 3 Opus and
    LLaMA-3.1-405B-Instruct. Ablation studies also suggest plausible reasons for why
    creating open instruction-tuning datasets via naive crowd-sourcing has proved difficult.
    In our dataset, adding 20% low quality answers (``shirkers'') causes a noticeable
    degradation in performance. The Instruct-SkillMix pipeline seems flexible and adaptable
    to other settings.

wu2024conceptmix-a-compositional:
  title: "ConceptMix: A Compositional Image Generation Benchmark with Controllable Difficulty"
  link: "https://arxiv.org/abs/2408.14339"
  arxiv: "2408.14339"
  venue: "NeurIPS 2024 Datasets Track"
  authors: "Xindi Wu, Dingli Yu, Yangsibo Huang, Olga Russakovsky, Sanjeev Arora"
  year: 2024
  abstract: >-
    Compositionality is a critical capability in Text-to-Image (T2I) models, as it reflects
    their ability to understand and combine multiple concepts from text descriptions.
    Existing evaluations of compositional capability rely heavily on human-designed text
    prompts or fixed templates, limiting their diversity and complexity, and yielding low
    discriminative power. We propose ConceptMix, a scalable, controllable, and customizable
    benchmark which automatically evaluates compositional generation ability of T2I models.
    This is done in two stages. First, ConceptMix generates the text prompts: concretely,
    using categories of visual concepts (e.g., objects, colors, shapes, spatial
    relationships), it randomly samples an object and k-tuples of visual concepts, then uses
    GPT4-o to generate text prompts for image generation based on these sampled concepts.
    Second, ConceptMix evaluates the images generated in response to these prompts:
    concretely, it checks how many of the k concepts actually appeared in the image by
    generating one question per visual concept and using a strong VLM to answer them.
    Through administering ConceptMix to a diverse set of T2I models (proprietary as well as
    open ones) using increasing values of k, we show that our ConceptMix has higher
    discrimination power than earlier benchmarks. Specifically, ConceptMix reveals that the
    performance of several models, especially open models, drops dramatically with increased
    k. Importantly, it also provides insight into the lack of prompt diversity in widely-
    used training datasets. Additionally, we conduct extensive human studies to validate the
    design of ConceptMix and compare our automatic grading with human judgement. We hope it
    will guide future T2I model development.

shah2024ai-assisted-generation-of:
  title: "AI-Assisted Generation of Difficult Math Questions"
  link: "https://arxiv.org/abs/2407.21009"
  arxiv: "2407.21009"
  venue: "MATH-AI Workshop at NeurIPS 2024"
  authors: "Vedant Shah, Dingli Yu, Kaifeng Lyu, Simon Park, Nan Rosemary Ke, Michael Mozer, Yoshua Bengio, Sanjeev Arora, Anirudh Goyal"
  year: 2024
  code: "https://github.com/veds12/ai_assisted_questions"
  abstract: >-
    Current LLM training positions mathematical reasoning as a core capability. With
    publicly available sources fully tapped, there is unmet demand for diverse and
    challenging math questions. Relying solely on human experts is both time-consuming and
    costly, while LLM-generated questions often lack the requisite diversity and difficulty.
    We present a design framework that combines the strengths of LLMs with a human-in-the-
    loop approach to generate a diverse array of challenging math questions. We leverage LLM
    metacognition skills [Didolkar et al., 2024] of a strong LLM to extract core "skills"
    from existing math datasets. These skills serve as the basis for generating novel and
    difficult questions by prompting the LLM with random pairs of core skills. The use of
    two different skills within each question makes finding such questions an "out of
    distribution" task for both LLMs and humans. Our pipeline employs LLMs to iteratively
    generate and refine questions and solutions through multiturn prompting. Human
    annotators then verify and further refine the questions, with their efficiency enhanced
    via further LLM interactions. Applying this pipeline on skills extracted from the MATH
    dataset [Hendrycks et al., 2021] resulted in MATH$^2$ - a dataset of higher-quality math
    questions, as evidenced by: (a) Lower performance of all models on MATH$^2$ than on MATH
    (b) Higher performance on MATH when using MATH$^2$ questions as in-context examples.
    Although focused on mathematics, our methodology seems applicable to other domains
    requiring structured reasoning, and potentially as a component of scalable oversight.
    Also of interest is a striking relationship observed between models' performance on the
    new dataset: the success rate on MATH$^2$ is the square on MATH, suggesting that
    successfully solving the question in MATH$^2$ requires a nontrivial combination of two
    distinct math skills.

wang2024charxiv-charting-gaps:
  title: "CharXiv: Charting Gaps in Realistic Chart Understanding in Multimodal LLMs"
  link: "https://arxiv.org/abs/2406.18521"
  arxiv: "2406.18521"
  venue: "NeurIPS 2024"
  authors: "Zirui Wang, Mengzhou Xia, Luxi He, Howard Chen, Yitao Liu, Richard Zhu, Kaiqu Liang, Xindi Wu, Haotian Liu, Sadhika Malladi, Alexis Chevalier, Sanjeev Arora, Danqi Chen"
  year: 2024
  code: "https://github.com/princeton-nlp/CharXiv"
  project: "https://charxiv.github.io/"
  abstract: >-
    Chart understanding plays a pivotal role when applying Multimodal Large Language Models
    (MLLMs) to real-world tasks such as analyzing scientific papers or financial reports.
    However, existing datasets often focus on oversimplified and homogeneous charts with
    template-based questions, leading to an over-optimistic measure of progress. We
    demonstrate that although open-source models can appear to outperform strong proprietary
    models on these benchmarks, a simple stress test with slightly different charts or
    questions can deteriorate performance by up to 34.5%. In this work, we propose CharXiv,
    a comprehensive evaluation suite involving 2,323 natural, challenging, and diverse
    charts from arXiv papers. CharXiv includes two types of questions: 1) descriptive
    questions about examining basic chart elements and 2) reasoning questions that require
    synthesizing information across complex visual elements in the chart. To ensure quality,
    all charts and questions are handpicked, curated, and verified by human experts. Our
    results reveal a substantial, previously underestimated gap between the reasoning skills
    of the strongest proprietary model (i.e., GPT-4o), which achieves 47.1% accuracy, and
    the strongest open-source model (i.e., InternVL Chat V1.5), which achieves 29.2%. All
    models lag far behind human performance of 80.5%, underscoring weaknesses in the chart
    understanding capabilities of existing MLLMs. We hope CharXiv facilitates future
    research on MLLM chart understanding by providing a more realistic and faithful measure
    of progress. Project page and leaderboard: https://charxiv.github.io/

didolkar2024metacognitive-capabilities-of:
  title: "Metacognitive Capabilities of LLMs: An Exploration in Mathematical Problem Solving"
  link: "https://arxiv.org/abs/2405.12205"
  arxiv: "2405.12205"
  venue: "NeurIPS 2024"
  authors: "Aniket Didolkar, Anirudh Goyal, Nan Rosemary Ke, Siyuan Guo, Michal Valko, Timothy Lillicrap, Danilo Rezende, Yoshua Bengio, Michael Mozer, Sanjeev Arora"
  year: 2024
  abstract: >-
    Metacognitive knowledge refers to humans' intuitive knowledge of their own thinking and
    reasoning processes. Today's best LLMs clearly possess some reasoning processes. The
    paper gives evidence that they also have metacognitive knowledge, including ability to
    name skills and procedures to apply given a task. We explore this primarily in context
    of math reasoning, developing a prompt-guided interaction procedure to get a powerful
    LLM to assign sensible skill labels to math questions, followed by having it perform
    semantic clustering to obtain coarser families of skill labels. These coarse skill
    labels look interpretable to humans. To validate that these skill labels are meaningful
    and relevant to the LLM's reasoning processes we perform the following experiments. (a)
    We ask GPT-4 to assign skill labels to training questions in math datasets GSM8K and
    MATH. (b) When using an LLM to solve the test questions, we present it with the full
    list of skill labels and ask it to identify the skill needed. Then it is presented with
    randomly selected exemplar solved questions associated with that skill label. This
    improves accuracy on GSM8k and MATH for several strong LLMs, including code-assisted
    models. The methodology presented is domain-agnostic, even though this article applies
    it to math problems.

lyu2024keeping-llms-aligned:
  title: "Keeping LLMs Aligned After Fine-tuning: The Crucial Role of Prompt Templates"
  link: "https://arxiv.org/abs/2402.18540"
  arxiv: "2402.18540"
  venue: "NeurIPS 2024"
  authors: "Kaifeng Lyu, Haoyu Zhao, Xinran Gu, Dingli Yu, Anirudh Goyal, Sanjeev Arora"
  year: 2024
  code: "https://github.com/vfleaking/ptst"
  abstract: >-
    Public LLMs such as the Llama 2-Chat underwent alignment training and were considered
    safe. Recently Qi et al. [2024] reported that even benign fine-tuning on seemingly safe
    datasets can give rise to unsafe behaviors in the models. The current paper is about
    methods and best practices to mitigate such loss of alignment. We focus on the setting
    where a public model is fine-tuned before serving users for specific usage, where the
    model should improve on the downstream task while maintaining alignment. Through
    extensive experiments on several chat models (Meta's Llama 2-Chat, Mistral AI's Mistral
    7B Instruct v0.2, and OpenAI's GPT-3.5 Turbo), this paper uncovers that the prompt
    templates used during fine-tuning and inference play a crucial role in preserving safety
    alignment, and proposes the ``Pure Tuning, Safe Testing'' (PTST) strategy -- fine-tune
    models without a safety prompt, but include it at test time. This seemingly
    counterintuitive strategy incorporates an intended distribution shift to encourage
    alignment preservation. Fine-tuning experiments on GSM8K, ChatDoctor, and OpenOrca show
    that PTST significantly reduces the rise of unsafe behaviors.

chevalier2024language-models-as:
  title: "Language Models as Science Tutors"
  link: "https://arxiv.org/abs/2402.11111"
  arxiv: "2402.11111"
  venue: "ICML 2024"
  authors: "Alexis Chevalier, Jiayi Geng, Alexander Wettig, Howard Chen, Sebastian Mizera, Toni Annala, Max Jameson Aragon, Arturo Rodríguez Fanlo, Simon Frieder, Simon Machado, Akshara Prabhakar, Ellie Thieu, Jiachen T Wang, Zirui Wang, Xindi Wu, Mengzhou Xia, Wenhan Jia, Jiatong Yu, Jun-Jie Zhu, Zhiyong Jason Ren, Sanjeev Arora, Danqi Chen"
  year: 2024
  code: "https://github.com/princeton-nlp/lm-science-tutor"
  abstract: >-
    NLP has recently made exciting progress toward training language models (LMs) with
    strong scientific problem-solving skills. However, model development has not focused on
    real-life use-cases of LMs for science, including applications in education that require
    processing long scientific documents. To address this, we introduce TutorEval and
    TutorChat. TutorEval is a diverse question-answering benchmark consisting of questions
    about long chapters from STEM textbooks, written by experts. TutorEval helps measure
    real-life usability of LMs as scientific assistants, and it is the first benchmark
    combining long contexts, free-form generation, and multi-disciplinary scientific
    knowledge. Moreover, we show that fine-tuning base models with existing dialogue
    datasets leads to poor performance on TutorEval. Therefore, we create TutorChat, a
    dataset of 80,000 long synthetic dialogues about textbooks. We use TutorChat to fine-
    tune Llemma models with 7B and 34B parameters. These LM tutors specialized in math have
    a 32K-token context window, and they excel at TutorEval while performing strongly on
    GSM8K and MATH. Our datasets build on open-source materials, and we release our models,
    data, and evaluations.

xia2024less-selecting-influential:
  title: "Less: Selecting influential data for targeted instruction tuning"
  link: "https://arxiv.org/abs/2402.04333"
  arxiv: "2402.04333"
  venue: "ICML 2024"
  authors: "Mengzhou Xia, Sadhika Malladi, Suchin Gururangan, Sanjeev Arora, Danqi Chen"
  year: 2024
  code: "https://github.com/princeton-nlp/less"
  abstract: >-
    Instruction tuning has unlocked powerful capabilities in large language models (LLMs),
    effectively using combined datasets to develop generalpurpose chatbots. However, real-
    world applications often require a specialized suite of skills (e.g., reasoning). The
    challenge lies in identifying the most relevant data from these extensive datasets to
    effectively develop specific capabilities, a setting we frame as targeted instruction
    tuning. We propose LESS, an optimizer-aware and practically efficient algorithm to
    effectively estimate data influences and perform Low-rank gradiEnt Similarity Search for
    instruction data selection. Crucially, LESS adapts existing influence formulations to
    work with the Adam optimizer and variable-length instruction data. LESS first constructs
    a highly reusable and transferable gradient datastore with low-dimensional gradient
    features and then selects examples based on their similarity to few-shot examples
    embodying a specific capability. Experiments show that training on a LESS-selected 5% of
    the data can often outperform training on the full dataset across diverse downstream
    tasks. Furthermore, the selected data is highly transferable: smaller models can be
    leveraged to select useful data for larger models and models from different families.
    Our qualitative analysis shows that our method goes beyond surface form cues to identify
    data that exemplifies the necessary reasoning skills for the intended downstream
    application.

######################### 2023 #########################
shah2023unlearning-via-sparse:
  title: "Unlearning via Sparse Representations"
  link: "https://arxiv.org/abs/2311.15268"
  arxiv: "2311.15268"
  venue: "Preprint"
  authors: "Vedant Shah, Frederik Träuble, Ashish Malik, Hugo Larochelle, Michael Mozer, Sanjeev Arora, Yoshua Bengio, Anirudh Goyal"
  year: 2023
  abstract: >-
    Machine \emph{unlearning}, which involves erasing knowledge about a \emph{forget set}
    from a trained model, can prove to be costly and infeasible by existing techniques. We
    propose a nearly compute-free zero-shot unlearning technique based on a discrete
    representational bottleneck. We show that the proposed technique efficiently unlearns
    the forget set and incurs negligible damage to the model's performance on the rest of
    the data set. We evaluate the proposed technique on the problem of \textit{class
    unlearning} using three datasets: CIFAR-10, CIFAR-100, and LACUNA-100. We compare the
    proposed technique to SCRUB, a state-of-the-art approach which uses knowledge
    distillation for unlearning. Across all three datasets, the proposed technique performs
    as well as, if not better than SCRUB while incurring almost no computational cost.

yu2023skill-mix-a-flexible:
  title: "Skill-Mix: a Flexible and Expandable Family of Evaluations for AI models"
  link: "https://arxiv.org/abs/2310.17567"
  arxiv: "2310.17567"
  venue: "ICLR 2024"
  authors: "Dingli Yu, Simran Kaur, Arushi Gupta, Jonah Brown-Cohen, Anirudh Goyal, Sanjeev Arora"
  year: 2023
  abstract: >-
    With LLMs shifting their role from statistical modeling of language to serving as
    general-purpose AI agents, how should LLM evaluations change? Arguably, a key ability of
    an AI agent is to flexibly combine, as needed, the basic skills it has learned. The
    capability to combine skills plays an important role in (human) pedagogy and also in a
    paper on emergence phenomena (Arora & Goyal, 2023). This work introduces Skill-Mix, a
    new evaluation to measure ability to combine skills. Using a list of $N$ skills the
    evaluator repeatedly picks random subsets of $k$ skills and asks the LLM to produce text
    combining that subset of skills. Since the number of subsets grows like $N^k$, for even
    modest $k$ this evaluation will, with high probability, require the LLM to produce text
    significantly different from any text in the training set. The paper develops a
    methodology for (a) designing and administering such an evaluation, and (b) automatic
    grading (plus spot-checking by humans) of the results using GPT-4 as well as the open
    LLaMA-2 70B model. Administering a version of to popular chatbots gave results that,
    while generally in line with prior expectations, contained surprises. Sizeable
    differences exist among model capabilities that are not captured by their ranking on
    popular LLM leaderboards ("cramming for the leaderboard"). Furthermore, simple
    probability calculations indicate that GPT-4's reasonable performance on $k=5$ is
    suggestive of going beyond "stochastic parrot" behavior (Bender et al., 2021), i.e., it
    combines skills in ways that it had not seen during training. We sketch how the
    methodology can lead to a Skill-Mix based eco-system of open evaluations for AI
    capabilities of future models.

arora2023a-theory-for:
  title: "A Theory for Emergence of Complex Skills in Language Models"
  link: "https://arxiv.org/abs/2307.15936"
  arxiv: "2307.15936"
  venue: "Preprint"
  authors: "Sanjeev Arora, Anirudh Goyal"
  year: 2023
  abstract: >-
    A major driver of AI products today is the fact that new skills emerge in language
    models when their parameter set and training corpora are scaled up. This phenomenon is
    poorly understood, and a mechanistic explanation via mathematical analysis of gradient-
    based training seems difficult. The current paper takes a different approach, analysing
    emergence using the famous (and empirical) Scaling Laws of LLMs and a simple statistical
    framework. Contributions include: (a) A statistical framework that relates cross-entropy
    loss of LLMs to competence on the basic skills that underlie language tasks. (b)
    Mathematical analysis showing that the Scaling Laws imply a strong form of inductive
    bias that allows the pre-trained model to learn very efficiently. We informally call
    this {\em slingshot generalization} since naively viewed it appears to give competence
    levels at skills that violate usual generalization theory. (c) A key example of
    slingshot generalization, that competence at executing tasks involving $k$-tuples of
    skills emerges essentially at the same scaling and same rate as competence on the
    elementary skills themselves.

panigrahi2023trainable-transformer-in:
  title: "Trainable Transformer in Transformer"
  link: "https://arxiv.org/abs/2307.01189"
  arxiv: "2307.01189"
  venue: "ICML 2024"
  authors: "Abhishek Panigrahi, Sadhika Malladi, Mengzhou Xia, Sanjeev Arora"
  year: 2023
  code: "https://github.com/abhishekpanigrahi1996/transformer_in_transformer"
  abstract: >-
    Recent works attribute the capability of in-context learning (ICL) in large pre-trained
    language models to implicitly simulating and fine-tuning an internal model (e.g., linear
    or 2-layer MLP) during inference. However, such constructions require large memory
    overhead, which makes simulation of more sophisticated internal models intractable. In
    this work, we propose an efficient construction, Transformer in Transformer (in short,
    TinT), that allows a transformer to simulate and fine-tune complex models internally
    during inference (e.g., pre-trained language models). In particular, we introduce
    innovative approximation techniques that allow a TinT model with less than 2 billion
    parameters to simulate and fine-tune a 125 million parameter transformer model within a
    single forward pass. TinT accommodates many common transformer variants and its design
    ideas also improve the efficiency of past instantiations of simple models inside
    transformers. We conduct end-to-end experiments to validate the internal fine-tuning
    procedure of TinT on various language modeling and downstream tasks. For example, even
    with a limited one-step budget, we observe TinT for a OPT-125M model improves
    performance by 4-16% absolute on average compared to OPT-125M. These findings suggest
    that large pre-trained language models are capable of performing intricate subroutines.
    To facilitate further work, a modular and extensible codebase for TinT is included.

malladi2023fine-tuning-language-models:
  title: "Fine-Tuning Language Models with Just Forward Passes"
  link: "https://proceedings.neurips.cc/paper_files/paper/2023/hash/a627810151be4d13f907ac898ff7e948-Abstract-Conference.html"
  arxiv: "2305.17333"
  venue: "NeurIPS 2023"
  authors: "Sadhika Malladi, Tianyu Gao, Eshaan Nichani, Alex Damian, Jason D Lee, Danqi Chen, Sanjeev Arora"
  year: 2023
  code: "https://github.com/princeton-nlp/mezo"
  abstract: >-
    Fine-tuning language models (LMs) has yielded success on diverse downstream tasks, but
    as LMs grow in size, backpropagation requires a prohibitively large amount of memory.
    Zeroth-order (ZO) methods can in principle estimate gradients using only two forward
    passes but are theorized to be catastrophically slow for optimizing large models. In
    this work, we propose a memory-efficient zerothorder optimizer (MeZO), adapting the
    classical ZO-SGD method to operate in-place, thereby fine-tuning LMs with the same
    memory footprint as inference. For example, with a single A100 80GB GPU, MeZO can train
    a 30-billion parameter model, whereas fine-tuning with backpropagation can train only a
    2.7B LM with the same budget. We conduct comprehensive experiments across model types
    (masked and autoregressive LMs), model scales (up to 66B), and downstream tasks
    (classification, multiple-choice, and generation). Our results demonstrate that (1) MeZO
    significantly outperforms in-context learning and linear probing; (2) MeZO achieves
    comparable performance to fine-tuning with backpropagation across multiple tasks, with
    up to 12x memory reduction and up to 2x GPU-hour reduction in our implementation; (3)
    MeZO is compatible with both full-parameter and parameter-efficient tuning techniques
    such as LoRA and prefix tuning; (4) MeZO can effectively optimize non-differentiable
    objectives (e.g., maximizing accuracy or F1). We support our empirical findings with
    theoretical insights, highlighting how adequate pre-training and task prompts enable
    MeZO to fine-tune huge models, despite classical ZO analyses suggesting otherwise.

gu2023why-(and-when):
  title: "Why (and When) does Local SGD Generalize Better than SGD?"
  link: "https://arxiv.org/abs/2303.01215"
  arxiv: "2303.01215"
  venue: "ICLR 2023"
  authors: "Xinran Gu, Kaifeng Lyu, Longbo Huang, Sanjeev Arora"
  year: 2023
  abstract: >-
    Local SGD is a communication-efficient variant of SGD for large-scale training, where
    multiple GPUs perform SGD independently and average the model parameters periodically.
    It has been recently observed that Local SGD can not only achieve the design goal of
    reducing the communication overhead but also lead to higher test accuracy than the
    corresponding SGD baseline (Lin et al., 2020b), though the training regimes for this to
    happen are still in debate (Ortiz et al., 2021). This paper aims to understand why (and
    when) Local SGD generalizes better based on Stochastic Differential Equation (SDE)
    approximation. The main contributions of this paper include (i) the derivation of an SDE
    that captures the long-term behavior of Local SGD in the small learning rate regime,
    showing how noise drives the iterate to drift and diffuse after it has reached close to
    the manifold of local minima, (ii) a comparison between the SDEs of Local SGD and SGD,
    showing that Local SGD induces a stronger drift term that can result in a stronger
    effect of regularization, e.g., a faster reduction of sharpness, and (iii) empirical
    evidence validating that having a small learning rate and long enough training time
    enables the generalization improvement over SGD but removing either of the two
    conditions leads to no improvement.

panigrahi2023task-specific-skill-localization:
  title: "Task-Specific Skill Localization in Fine-tuned Language Models"
  link: "https://proceedings.mlr.press/v202/panigrahi23a.html"
  arxiv: "2302.06600"
  venue: "ICML 2023"
  authors: "Abhishek Panigrahi, Nikunj Saunshi, Haoyu Zhao, Sanjeev Arora"
  year: 2023
  code: "https://github.com/abhishekpanigrahi1996/Skill-Localization-by-grafting"
  abstract: >-
    Pre-trained language models can be fine-tuned to solve diverse NLP tasks, including in
    few-shot settings. Thus fine-tuning allows the model to quickly pick up task-specific
    ``skills,'' but there has been limited study of where these newly-learnt skills reside
    inside the massive model. This paper introduces the term skill localization for this
    problem and proposes a solution. Given the downstream task and a model fine-tuned on
    that task, a simple optimization is used to identify a very small subset of parameters
    ($\sim0.01$% of model parameters) responsible for ($>95$%) of the model's performance,
    in the sense that grafting the fine-tuned values for just this tiny subset onto the pre-
    trained model gives performance almost as well as the fine-tuned model. While
    reminiscent of recent works on parameter-efficient fine-tuning, the novel aspects here
    are that: (i) No further re-training is needed on the subset (unlike, say, with lottery
    tickets). (ii) Notable improvements are seen over vanilla fine-tuning with respect to
    calibration of predictions in-distribution ($40$-$90$% error reduction) as well as the
    quality of predictions out-of-distribution (OOD). In models trained on multiple tasks, a
    stronger notion of skill localization is observed, where the sparse regions
    corresponding to different tasks are almost disjoint, and their overlap (when it
    happens) is a proxy for task similarity. Experiments suggest that localization via
    grafting can assist certain forms of continual learning.

######################### 2022 #########################
gupta2022new-definitions-and:
  title: "New Definitions and Evaluations for Saliency Methods: Staying Intrinsic, Complete and Sound"
  link: "https://proceedings.neurips.cc/paper_files/paper/2022/hash/d6383e7643415842b48a5077a1b09c98-Abstract-Conference.html"
  arxiv: "2211.02912"
  venue: "NeurIPS 2022"
  authors: "Arushi Gupta, Nikunj Saunshi, Dingli Yu, Kaifeng Lyu, Sanjeev Arora"
  year: 2022
  abstract: >-
    Saliency methods compute heat maps that highlight portions of an input that were most
    {\em important} for the label assigned to it by a deep net. Evaluations of saliency
    methods convert this heat map into a new {\em masked input} by retaining the $k$
    highest-ranked pixels of the original input and replacing the rest with
    \textquotedblleft uninformative\textquotedblright\ pixels, and checking if the net's
    output is mostly unchanged. This is usually seen as an {\em explanation} of the output,
    but the current paper highlights reasons why this inference of causality may be suspect.
    Inspired by logic concepts of {\em completeness \& soundness}, it observes that the
    above type of evaluation focuses on completeness of the explanation, but ignores
    soundness. New evaluation metrics are introduced to capture both notions, while staying
    in an {\em intrinsic} framework -- i.e., using the dataset and the net, but no
    separately trained nets, human evaluations, etc. A simple saliency method is described
    that matches or outperforms prior methods in the evaluations. Experiments also suggest
    new intrinsic justifications, based on soundness, for popular heuristic tricks such as
    TV regularization and upsampling.

malladi2023a-kernel-based-view:
  title: "A Kernel-Based View of Language Model Fine-Tuning"
  link: "https://proceedings.mlr.press/v202/malladi23a.html"
  arxiv: "2210.05643"
  venue: "ICML 2023"
  authors: "Sadhika Malladi, Alexander Wettig, Dingli Yu, Danqi Chen, Sanjeev Arora"
  year: 2022
  code: "https://github.com/princeton-nlp/lm-kernel-ft"
  abstract: >-
    It has become standard to solve NLP tasks by fine-tuning pre-trained language models
    (LMs), especially in low-data settings. There is minimal theoretical understanding of
    empirical success, e.g., why fine-tuning a model with $10^8$ or more parameters on a
    couple dozen training points does not result in overfitting. We investigate whether the
    Neural Tangent Kernel (NTK) - which originated as a model to study the gradient descent
    dynamics of infinitely wide networks with suitable random initialization - describes
    fine-tuning of pre-trained LMs. This study was inspired by the decent performance of NTK
    for computer vision tasks (Wei et al., 2022). We extend the NTK formalism to Adam and
    use Tensor Programs (Yang, 2020) to characterize conditions under which the NTK lens may
    describe fine-tuning updates to pre-trained language models. Extensive experiments on 14
    NLP tasks validate our theory and show that formulating the downstream task as a masked
    word prediction problem through prompting often induces kernel-based dynamics during
    fine-tuning. Finally, we use this kernel view to propose an explanation for the success
    of parameter-efficient subspace-based fine-tuning methods.

saunshi2022understanding-influence-functions:
  title: "Understanding Influence Functions and Datamodels via Harmonic Analysis"
  link: "https://arxiv.org/abs/2210.01072"
  arxiv: "2210.01072"
  venue: "ICLR 2023"
  authors: "Nikunj Saunshi, Arushi Gupta, Mark Braverman, Sanjeev Arora"
  year: 2022
  abstract: >-
    Influence functions estimate effect of individual data points on predictions of the
    model on test data and were adapted to deep learning in Koh and Liang [2017]. They have
    been used for detecting data poisoning, detecting helpful and harmful examples,
    influence of groups of datapoints, etc. Recently, Ilyas et al. [2022] introduced a
    linear regression method they termed datamodels to predict the effect of training points
    on outputs on test data. The current paper seeks to provide a better theoretical
    understanding of such interesting empirical phenomena. The primary tool is harmonic
    analysis and the idea of noise stability. Contributions include: (a) Exact
    characterization of the learnt datamodel in terms of Fourier coefficients. (b) An
    efficient method to estimate the residual error and quality of the optimum linear
    datamodel without having to train the datamodel. (c) New insights into when influences
    of groups of datapoints may or may not add up linearly.

lyu2022understanding-the-generalization:
  title: "Understanding the Generalization Benefit of Normalization Layers: Sharpness Reduction"
  link: "https://proceedings.neurips.cc/paper_files/paper/2022/hash/dffd1c523512e557f4e75e8309049213-Abstract-Conference.html"
  arxiv: "2206.07085"
  venue: "NeurIPS 2022"
  authors: "Kaifeng Lyu, Zhiyuan Li, Sanjeev Arora"
  year: 2022
  abstract: >-
    Normalization layers (e.g., Batch Normalization, Layer Normalization) were introduced to
    help with optimization difficulties in very deep nets, but they clearly also help
    generalization, even in not-so-deep nets. Motivated by the long-held belief that flatter
    minima lead to better generalization, this paper gives mathematical analysis and
    supporting experiments suggesting that normalization (together with accompanying weight-
    decay) encourages GD to reduce the sharpness of loss surface. Here "sharpness" is
    carefully defined given that the loss is scale-invariant, a known consequence of
    normalization. Specifically, for a fairly broad class of neural nets with normalization,
    our theory explains how GD with a finite learning rate enters the so-called Edge of
    Stability (EoS) regime, and characterizes the trajectory of GD in this regime via a
    continuous sharpness-reduction flow.

malladi2022on-the-sdes:
  title: "On the SDEs and Scaling Rules for Adaptive Gradient Algorithms"
  link: "https://proceedings.neurips.cc/paper_files/paper/2022/hash/32ac710102f0620d0f28d5d05a44fe08-Abstract-Conference.html"
  arxiv: "2205.10287"
  venue: "NeurIPS 2022"
  authors: "Sadhika Malladi, Kaifeng Lyu, Abhishek Panigrahi, Sanjeev Arora"
  year: 2022
  code: "https://github.com/abhishekpanigrahi1996/Adaptive-SDE"
  abstract: >-
    Approximating Stochastic Gradient Descent (SGD) as a Stochastic Differential Equation
    (SDE) has allowed researchers to enjoy the benefits of studying a continuous
    optimization trajectory while carefully preserving the stochasticity of SGD. Analogous
    study of adaptive gradient methods, such as RMSprop and Adam, has been challenging
    because there were no rigorously proven SDE approximations for these methods. This paper
    derives the SDE approximations for RMSprop and Adam, giving theoretical guarantees of
    their correctness as well as experimental validation of their applicability to common
    large-scaling vision and language settings. A key practical result is the derivation of
    a $\textit{square root scaling rule}$ to adjust the optimization hyperparameters of
    RMSprop and Adam when changing batch size, and its empirical validation in deep learning
    settings.

arora2022understanding-gradient-descent:
  title: "Understanding Gradient Descent on the Edge of Stability in Deep Learning"
  link: "https://proceedings.mlr.press/v162/arora22a.html"
  arxiv: "2205.09745"
  venue: "ICML 2022"
  authors: "Sanjeev Arora, Zhiyuan Li, Abhishek Panigrahi"
  year: 2022
  abstract: >-
    Deep learning experiments by Cohen et al. [2021] using deterministic Gradient Descent
    (GD) revealed an Edge of Stability (EoS) phase when learning rate (LR) and sharpness
    (i.e., the largest eigenvalue of Hessian) no longer behave as in traditional
    optimization. Sharpness stabilizes around $2/$LR and loss goes up and down across
    iterations, yet still with an overall downward trend. The current paper mathematically
    analyzes a new mechanism of implicit regularization in the EoS phase, whereby GD updates
    due to non-smooth loss landscape turn out to evolve along some deterministic flow on the
    manifold of minimum loss. This is in contrast to many previous results about implicit
    bias either relying on infinitesimal updates or noise in gradient. Formally, for any
    smooth function $L$ with certain regularity condition, this effect is demonstrated for
    (1) Normalized GD, i.e., GD with a varying LR $η_t =\fracη{\| \nabla L(x(t)) \|}$ and
    loss $L$; (2) GD with constant LR and loss $\sqrt{L- \min_x L(x)}$. Both provably enter
    the Edge of Stability, with the associated flow on the manifold minimizing
    $λ_{1}(\nabla^2 L)$. The above theoretical results have been corroborated by an
    experimental study.

lu2022adaptive-gradient-methods:
  title: "Adaptive Gradient Methods with Local Guarantees"
  link: "https://arxiv.org/abs/2203.01400"
  arxiv: "2203.01400"
  venue: "Preprint"
  authors: "Zhou Lu, Wenhan Xia, Sanjeev Arora, Elad Hazan"
  year: 2022
  abstract: >-
    Adaptive gradient methods are the method of choice for optimization in machine learning
    and used to train the largest deep models. In this paper we study the problem of
    learning a local preconditioner, that can change as the data is changing along the
    optimization trajectory. We propose an adaptive gradient method that has provable
    adaptive regret guarantees vs. the best local preconditioner. To derive this guarantee,
    we prove a new adaptive regret bound in online learning that improves upon previous
    adaptive online learning methods. We demonstrate the robustness of our method in
    automatically choosing the optimal learning rate schedule for popular benchmarking tasks
    in vision and language domains. Without the need to manually tune a learning rate
    schedule, our method can, in a single run, achieve comparable and stable task accuracy
    as a fine-tuned optimizer.

saunshi2022understanding-contrastive-learning:
  title: "Understanding Contrastive Learning Requires Incorporating Inductive Biases"
  link: "https://proceedings.mlr.press/v162/saunshi22a.html"
  arxiv: "2202.14037"
  venue: "ICML 2022"
  authors: "Nikunj Saunshi, Jordan Ash, Surbhi Goel, Dipendra Misra, Cyril Zhang, Sanjeev Arora, Sham Kakade, Akshay Krishnamurthy"
  year: 2022
  abstract: >-
    Contrastive learning is a popular form of self-supervised learning that encourages
    augmentations (views) of the same input to have more similar representations compared to
    augmentations of different inputs. Recent attempts to theoretically explain the success
    of contrastive learning on downstream classification tasks prove guarantees depending on
    properties of {\em augmentations} and the value of {\em contrastive loss} of
    representations. We demonstrate that such analyses, that ignore {\em inductive biases}
    of the function class and training algorithm, cannot adequately explain the success of
    contrastive learning, even {\em provably} leading to vacuous guarantees in some
    settings. Extensive experiments on image and text domains highlight the ubiquity of this
    problem -- different function classes and algorithms behave very differently on
    downstream tasks, despite having the same augmentations and contrastive losses.
    Theoretical analysis is presented for the class of linear representations, where
    incorporating inductive biases of the function class allows contrastive learning to work
    with less stringent conditions compared to prior analyses.

######################### 2021 #########################
huang2021evaluating-gradient-inversion:
  title: "Evaluating Gradient Inversion Attacks and Defenses in Federated Learning"
  link: "https://proceedings.neurips.cc/paper_files/paper/2021/hash/3b3fff6463464959dcd1b68d0320f781-Abstract.html"
  arxiv: "2112.00059"
  venue: "NeurIPS 2021"
  authors: "Yangsibo Huang, Samyak Gupta, Zhao Song, Kai Li, Sanjeev Arora"
  year: 2021
  code: "https://github.com/Princeton-SysML/GradAttack"
  abstract: >-
    Gradient inversion attack (or input recovery from gradient) is an emerging threat to the
    security and privacy preservation of Federated learning, whereby malicious eavesdroppers
    or participants in the protocol can recover (partially) the clients' private data. This
    paper evaluates existing attacks and defenses. We find that some attacks make strong
    assumptions about the setup. Relaxing such assumptions can substantially weaken these
    attacks. We then evaluate the benefits of three proposed defense mechanisms against
    gradient inversion attacks. We show the trade-offs of privacy leakage and data utility
    of these defense methods, and find that combining them in an appropriate manner makes
    the attack less effective, even under the original strong assumptions. We also estimate
    the computation cost of end-to-end recovery of a single image under each evaluated
    defense. Our findings suggest that the state-of-the-art attacks can currently be
    defended against with minor data utility loss, as summarized in a list of potential
    strategies. Our code is available at: https://github.com/Princeton-SysML/GradAttack.

zhang2021on-predicting-generalization:
  title: "On Predicting Generalization using GANs"
  link: "https://arxiv.org/abs/2111.14212"
  arxiv: "2111.14212"
  venue: "ICLR 2022 (Spotlight)"
  authors: "Yi Zhang, Arushi Gupta, Nikunj Saunshi, Sanjeev Arora"
  year: 2021
  abstract: >-
    Research on generalization bounds for deep networks seeks to give ways to predict test
    error using just the training dataset and the network parameters. While generalization
    bounds can give many insights about architecture design, training algorithms, etc., what
    they do not currently do is yield good predictions for actual test error. A recently
    introduced Predicting Generalization in Deep Learning
    competition~\citep{jiang2020neurips} aims to encourage discovery of methods to better
    predict test error. The current paper investigates a simple idea: can test error be
    predicted using {\em synthetic data,} produced using a Generative Adversarial Network
    (GAN) that was trained on the same training dataset? Upon investigating several GAN
    models and architectures, we find that this turns out to be the case. In fact, using
    GANs pre-trained on standard datasets, the test error can be predicted without requiring
    any additional hyper-parameter tuning. This result is surprising because GANs have well-
    known limitations (e.g. mode collapse) and are known to not learn the data distribution
    accurately. Yet the generated samples are good enough to substitute for test data.
    Several additional experiments are presented to explore reasons why GANs do well at this
    task. In addition to a new approach for predicting generalization, the counter-intuitive
    phenomena presented in our work may also call for a better understanding of GANs'
    strengths and limitations.

lyu2021gradient-descent-on:
  title: "Gradient Descent on Two-layer Nets: Margin Maximization and Simplicity Bias"
  link: "https://proceedings.neurips.cc/paper_files/paper/2021/hash/6c351da15b5e8a743a21ee96a86e25df-Abstract.html"
  arxiv: "2110.13905"
  venue: "NeurIPS 2021"
  authors: "Kaifeng Lyu, Zhiyuan Li, Runzhe Wang, Sanjeev Arora"
  year: 2021
  abstract: >-
    The generalization mystery of overparametrized deep nets has motivated efforts to
    understand how gradient descent (GD) converges to low-loss solutions that generalize
    well. Real-life neural networks are initialized from small random values and trained
    with cross-entropy loss for classification (unlike the "lazy" or "NTK" regime of
    training where analysis was more successful), and a recent sequence of results (Lyu and
    Li, 2020; Chizat and Bach, 2020; Ji and Telgarsky, 2020) provide theoretical evidence
    that GD may converge to the "max-margin" solution with zero loss, which presumably
    generalizes well. However, the global optimality of margin is proved only in some
    settings where neural nets are infinitely or exponentially wide. The current paper is
    able to establish this global optimality for two-layer Leaky ReLU nets trained with
    gradient flow on linearly separable and symmetric data, regardless of the width. The
    analysis also gives some theoretical justification for recent empirical findings
    (Kalimeris et al., 2019) on the so-called simplicity bias of GD towards linear or other
    "simple" classes of solutions, especially early in training. On the pessimistic side,
    the paper suggests that such results are fragile. A simple data manipulation can make
    gradient flow converge to a linear classifier with suboptimal margin.

li2021what-happens-after:
  title: "What Happens after SGD Reaches Zero Loss?--A Mathematical Framework"
  link: "https://arxiv.org/abs/2110.06914"
  arxiv: "2110.06914"
  venue: "NeurIPS 2021,"
  authors: "Zhiyuan Li, Tianhao Wang, Sanjeev Arora"
  year: 2021
  abstract: >-
    Understanding the implicit bias of Stochastic Gradient Descent (SGD) is one of the key
    challenges in deep learning, especially for overparametrized models, where the local
    minimizers of the loss function $L$ can form a manifold. Intuitively, with a
    sufficiently small learning rate $η$, SGD tracks Gradient Descent (GD) until it gets
    close to such manifold, where the gradient noise prevents further convergence. In such a
    regime, Blanc et al. (2020) proved that SGD with label noise locally decreases a
    regularizer-like term, the sharpness of loss, $\mathrm{tr}[\nabla^2 L]$. The current
    paper gives a general framework for such analysis by adapting ideas from Katzenberger
    (1991). It allows in principle a complete characterization for the regularization effect
    of SGD around such manifold -- i.e., the "implicit bias" -- using a stochastic
    differential equation (SDE) describing the limiting dynamics of the parameters, which is
    determined jointly by the loss function and the noise covariance. This yields some new
    results: (1) a global analysis of the implicit bias valid for $η^{-2}$ steps, in
    contrast to the local analysis of Blanc et al. (2020) that is only valid for $η^{-1.6}$
    steps and (2) allowing arbitrary noise covariance. As an application, we show with
    arbitrary large initialization, label noise SGD can always escape the kernel regime and
    only requires $O(κ\ln d)$ samples for learning an $κ$-sparse overparametrized linear
    model in $\mathbb{R}^d$ (Woodworth et al., 2020), while GD initialized in the kernel
    regime requires $Ω(d)$ samples. This upper bound is minimax optimal and improves the
    previous $\tilde{O}(κ^2)$ upper bound (HaoChen et al., 2020).

arora2021opening-the-black:
  title: "Opening the Black Box of Deep Learning: Some Lessons and Take-aways"
  link: "https://dl.acm.org/doi/abs/10.1145/3410220.3453910"
  venue: "SIGMETRICS '21"
  authors: "Sanjeev Arora"
  year: 2021

arora2021technical-perspective-why:
  title: "Technical perspective: Why don't today's deep nets overfit to their training data?"
  link: "https://dl.acm.org/doi/abs/10.1145/3446773"
  venue: "Communications of the ACM"
  authors: "Sanjeev Arora"
  year: 2021

arora2021rip-van-winkle's:
  title: "Rip van Winkle's Razor: A Simple Estimate of Overfit to Test Data"
  link: "https://arxiv.org/abs/2102.13189"
  arxiv: "2102.13189"
  venue: "Preprint"
  authors: "Sanjeev Arora, Yi Zhang"
  year: 2021
  abstract: >-
    Traditional statistics forbids use of test data (a.k.a. holdout data) during training.
    Dwork et al. 2015 pointed out that current practices in machine learning, whereby
    researchers build upon each other's models, copying hyperparameters and even computer
    code -- amounts to implicitly training on the test set. Thus error rate on test data may
    not reflect the true population error. This observation initiated {\em adaptive data
    analysis}, which provides evaluation mechanisms with guaranteed upper bounds on this
    difference. With statistical query (i.e. test accuracy) feedbacks, the best upper bound
    is fairly pessimistic: the deviation can hit a practically vacuous value if the number
    of models tested is quadratic in the size of the test set. In this work, we present a
    simple new estimate, {\em Rip van Winkle's Razor}. It relies upon a new notion of
    \textquotedblleft information content\textquotedblright\ of a model: the amount of
    information that would have to be provided to an expert referee who is intimately
    familiar with the field and relevant science/math, and who has been just been woken up
    after falling asleep at the moment of the creation of the test data (like
    \textquotedblleft Rip van Winkle\textquotedblright\ of the famous fairy tale). This
    notion of information content is used to provide an estimate of the above deviation
    which is shown to be non-vacuous in many modern settings.

li2021on-the-validity:
  title: "On the Validity of Modeling SGD with Stochastic Differential Equations (SDEs)"
  link: "https://proceedings.neurips.cc/paper/2021/hash/69f62956429865909921fa916d61c1f8-Abstract.html"
  arxiv: "2102.12470"
  venue: "NeurIPS 2021"
  authors: "Zhiyuan Li, Sadhika Malladi, Sanjeev Arora"
  year: 2021
  abstract: >-
    It is generally recognized that finite learning rate (LR), in contrast to infinitesimal
    LR, is important for good generalization in real-life deep nets. Most attempted
    explanations propose approximating finite-LR SGD with Ito Stochastic Differential
    Equations (SDEs), but formal justification for this approximation (e.g., (Li et al.,
    2019)) only applies to SGD with tiny LR. Experimental verification of the approximation
    appears computationally infeasible. The current paper clarifies the picture with the
    following contributions: (a) An efficient simulation algorithm SVAG that provably
    converges to the conventionally used Ito SDE approximation. (b) A theoretically
    motivated testable necessary condition for the SDE approximation and its most famous
    implication, the linear scaling rule (Goyal et al., 2017), to hold. (c) Experiments
    using this simulation to demonstrate that the previously proposed SDE approximation can
    meaningfully capture the training and generalization properties of common deep nets.

######################### 2020 #########################
arora2020the-quest-for:
  title: "The Quest for Mathematical Understanding of Deep Learning"
  link: "https://drops.dagstuhl.de/search/documents?author=Arora,%20Sanjeev"
  venue: "40th IARCS Annual Conference on Foundations of Software Technology"
  authors: "Sanjeev Arora"
  year: 2020

li2020why-are-convolutional:
  title: "Why Are Convolutional Nets More Sample-Efficient than Fully-Connected Nets?"
  link: "https://arxiv.org/abs/2010.08515"
  arxiv: "2010.08515"
  venue: "ICLR 2021"
  authors: "Zhiyuan Li, Yi Zhang, Sanjeev Arora"
  year: 2020
  abstract: >-
    Convolutional neural networks often dominate fully-connected counterparts in
    generalization performance, especially on image classification tasks. This is often
    explained in terms of 'better inductive bias'. However, this has not been made
    mathematically rigorous, and the hurdle is that the fully connected net can always
    simulate the convolutional net (for a fixed task). Thus the training algorithm plays a
    role. The current work describes a natural task on which a provable sample complexity
    gap can be shown, for standard training algorithms. We construct a single natural
    distribution on $\mathbb{R}^d\times\{\pm 1\}$ on which any orthogonal-invariant
    algorithm (i.e. fully-connected networks trained with most gradient-based methods from
    gaussian initialization) requires $Ω(d^2)$ samples to generalize while $O(1)$ samples
    suffice for convolutional architectures. Furthermore, we demonstrate a single target
    function, learning which on all possible distributions leads to an $O(1)$ vs
    $Ω(d^2/\varepsilon)$ gap. The proof relies on the fact that SGD on fully-connected
    network is orthogonal equivariant. Similar results are achieved for $\ell_2$ regression
    and adaptive training algorithms, e.g. Adam and AdaGrad, which are only permutation
    equivariant.

huang2020texthide-tackling-data:
  title: "TextHide: Tackling Data Privacy in Language Understanding Tasks"
  link: "https://aclanthology.org/2020.findings-emnlp.123/"
  arxiv: "2010.06053"
  venue: "Findings of EMNLP 2020"
  authors: "Yangsibo Huang, Zhao Song, Danqi Chen, Kai Li, Sanjeev Arora"
  year: 2020
  code: "https://github.com/Hazelsuko07/TextHide"
  abstract: >-
    An unsolved challenge in distributed or federated learning is to effectively mitigate
    privacy risks without slowing down training or reducing accuracy. In this paper, we
    propose TextHide aiming at addressing this challenge for natural language understanding
    tasks. It requires all participants to add a simple encryption step to prevent an
    eavesdropping attacker from recovering private text data. Such an encryption step is
    efficient and only affects the task performance slightly. In addition, TextHide fits
    well with the popular framework of fine-tuning pre-trained language models (e.g., BERT)
    for any sentence or sentence-pair task. We evaluate TextHide on the GLUE benchmark, and
    our experiments show that TextHide can effectively defend attacks on shared gradients or
    representations and the averaged accuracy reduction is only $1.9\%$. We also present an
    analysis of the security of TextHide using a conjecture about the computational
    intractability of a mathematical problem. Our code is available at
    https://github.com/Hazelsuko07/TextHide

saunshi2020a-mathematical-exploration:
  title: "A Mathematical Exploration of Why Language Models Help Solve Downstream Tasks"
  link: "https://arxiv.org/abs/2010.03648"
  arxiv: "2010.03648"
  venue: "ICLR 2021"
  authors: "Nikunj Saunshi, Sadhika Malladi, Sanjeev Arora"
  year: 2020
  abstract: >-
    Autoregressive language models, pretrained using large text corpora to do well on next
    word prediction, have been successful at solving many downstream tasks, even with zero-
    shot usage. However, there is little theoretical understanding of this success. This
    paper initiates a mathematical study of this phenomenon for the downstream task of text
    classification by considering the following questions: (1) What is the intuitive
    connection between the pretraining task of next word prediction and text classification?
    (2) How can we mathematically formalize this connection and quantify the benefit of
    language modeling? For (1), we hypothesize, and verify empirically, that classification
    tasks of interest can be reformulated as sentence completion tasks, thus making language
    modeling a meaningful pretraining task. With a mathematical formalization of this
    hypothesis, we make progress towards (2) and show that language models that are
    $ε$-optimal in cross-entropy (log-perplexity) learn features that can linearly solve
    such classification tasks with $\mathcal{O}(\sqrtε)$ error, thus demonstrating that
    doing well on language modeling can be beneficial for downstream tasks. We
    experimentally verify various assumptions and theoretical findings, and also use
    insights from the analysis to design a new objective function that performs well on some
    classification tasks.

li2020reconciling-modern-deep:
  title: "Reconciling Modern Deep Learning with Traditional Optimization Analyses: The Intrinsic Learning Rate"
  link: "https://proceedings.neurips.cc/paper/2020/hash/a7453a5f026fb6831d68bdc9cb0edcae-Abstract.html"
  arxiv: "2010.02916"
  venue: "NeurIPS 2020"
  authors: "Zhiyuan Li, Kaifeng Lyu, Sanjeev Arora"
  year: 2020
  abstract: >-
    Recent works (e.g., (Li and Arora, 2020)) suggest that the use of popular normalization
    schemes (including Batch Normalization) in today's deep learning can move it far from a
    traditional optimization viewpoint, e.g., use of exponentially increasing learning
    rates. The current paper highlights other ways in which behavior of normalized nets
    departs from traditional viewpoints, and then initiates a formal framework for studying
    their mathematics via suitable adaptation of the conventional framework namely, modeling
    SGD-induced training trajectory via a suitable stochastic differential equation (SDE)
    with a noise term that captures gradient noise. This yields: (a) A new ' intrinsic
    learning rate' parameter that is the product of the normal learning rate and weight
    decay factor. Analysis of the SDE shows how the effective speed of learning varies and
    equilibrates over time under the control of intrinsic LR. (b) A challenge -- via theory
    and experiments -- to popular belief that good generalization requires large learning
    rates at the start of training. (c) New experiments, backed by mathematical intuition,
    suggesting the number of steps to equilibrium (in function space) scales as the inverse
    of the intrinsic learning rate, as opposed to the exponential time convergence bound
    implied by SDE analysis. We name it the Fast Equilibrium Conjecture and suggest it holds
    the key to why Batch Normalization is effective.

huang2020instahide-instance-hiding-schemes:
  title: "InstaHide: Instance-hiding Schemes for Private Distributed Learning"
  link: "https://proceedings.mlr.press/v119/huang20i.html"
  arxiv: "2010.02772"
  venue: "ICML 2020"
  authors: "Yangsibo Huang, Zhao Song, Kai Li, Sanjeev Arora"
  year: 2020
  code: "https://github.com/Hazelsuko07/InstaHide_Challenge"
  abstract: >-
    How can multiple distributed entities collaboratively train a shared deep net on their
    private data while preserving privacy? This paper introduces InstaHide, a simple
    encryption of training images, which can be plugged into existing distributed deep
    learning pipelines. The encryption is efficient and applying it during training has
    minor effect on test accuracy. InstaHide encrypts each training image with a "one-time
    secret key" which consists of mixing a number of randomly chosen images and applying a
    random pixel-wise mask. Other contributions of this paper include: (a) Using a large
    public dataset (e.g. ImageNet) for mixing during its encryption, which improves
    security. (b) Experimental results to show effectiveness in preserving privacy against
    known attacks with only minor effects on accuracy. (c) Theoretical analysis showing that
    successfully attacking privacy requires attackers to solve a difficult computational
    problem. (d) Demonstrating that use of the pixel-wise mask is important for security,
    since Mixup alone is shown to be insecure to some some efficient attacks. (e) Release of
    a challenge dataset https://github.com/Hazelsuko07/InstaHide_Challenge Our code is
    available at https://github.com/Hazelsuko07/InstaHide

huang2020privacy-preserving-learning-via:
  title: "Privacy-preserving Learning via Deep Net Pruning"
  link: "https://arxiv.org/abs/2003.01876"
  arxiv: "2003.01876"
  venue: "Preprint"
  authors: "Yangsibo Huang, Yushan Su, Sachin Ravi, Zhao Song, Sanjeev Arora, Kai Li"
  year: 2020
  abstract: >-
    This paper attempts to answer the question whether neural network pruning can be used as
    a tool to achieve differential privacy without losing much data utility. As a first step
    towards understanding the relationship between neural network pruning and differential
    privacy, this paper proves that pruning a given layer of the neural network is
    equivalent to adding a certain amount of differentially private noise to its hidden-
    layer activations. The paper also presents experimental results to show the practical
    implications of the theoretical finding and the key parameter values in a simple
    practical setting. These results show that neural network pruning can be a more
    effective alternative to adding differentially private noise for neural networks.

saunshi2020a-sample-complexity:
  title: "A Sample Complexity Separation between Non-Convex and Convex Meta-Learning"
  link: "https://proceedings.mlr.press/v119/saunshi20a.html"
  arxiv: "2002.11172"
  venue: "ICML 2020"
  authors: "Nikunj Saunshi, Yi Zhang, Mikhail Khodak, Sanjeev Arora"
  year: 2020
  abstract: >-
    One popular trend in meta-learning is to learn from many training tasks a common
    initialization for a gradient-based method that can be used to solve a new task with few
    samples. The theory of meta-learning is still in its early stages, with several recent
    learning-theoretic analyses of methods such as Reptile [Nichol et al., 2018] being for
    convex models. This work shows that convex-case analysis might be insufficient to
    understand the success of meta-learning, and that even for non-convex models it is
    important to look inside the optimization black-box, specifically at properties of the
    optimization trajectory. We construct a simple meta-learning instance that captures the
    problem of one-dimensional subspace learning. For the convex formulation of linear
    regression on this instance, we show that the new task sample complexity of any
    initialization-based meta-learning algorithm is $Ω(d)$, where $d$ is the input
    dimension. In contrast, for the non-convex formulation of a two layer linear network on
    the same instance, we show that both Reptile and multi-task representation learning can
    have new task sample complexity of $\mathcal{O}(1)$, demonstrating a separation from
    convex meta-learning. Crucially, analyses of the training dynamics of these methods
    reveal that they can meta-learn the correct subspace onto which the data should be
    projected.

arora2020provable-representation-learning:
  title: "Provable Representation Learning for Imitation Learning via Bi-level Optimization"
  link: "https://proceedings.mlr.press/v119/arora20a.html"
  arxiv: "2002.10544"
  venue: "ICML 2020"
  authors: "Sanjeev Arora, Simon Du, Sham Kakade, Yuping Luo, Nikunj Saunshi"
  year: 2020
  abstract: >-
    A common strategy in modern learning systems is to learn a representation that is useful
    for many tasks, a.k.a. representation learning. We study this strategy in the imitation
    learning setting for Markov decision processes (MDPs) where multiple experts'
    trajectories are available. We formulate representation learning as a bi-level
    optimization problem where the "outer" optimization tries to learn the joint
    representation and the "inner" optimization encodes the imitation learning setup and
    tries to learn task-specific parameters. We instantiate this framework for the imitation
    learning settings of behavior cloning and observation-alone. Theoretically, we show
    using our framework that representation learning can provide sample complexity benefits
    for imitation learning in both settings. We also provide proof-of-concept experiments to
    verify our theory.

zhang2020over-parameterized-adversarial-training:
  title: "Over-parameterized Adversarial Training: An Analysis Overcoming the Curse of Dimensionality"
  link: "https://proceedings.neurips.cc/paper_files/paper/2020/hash/0740bb92e583cd2b88ec7c59f985cb41-Abstract.html"
  arxiv: "2002.06668"
  venue: "NeurIPS 2020"
  authors: "Yi Zhang, Orestis Plevrakis, Simon S Du, Xingguo Li, Zhao Song, Sanjeev Arora"
  year: 2020
  abstract: >-
    Adversarial training is a popular method to give neural nets robustness against
    adversarial perturbations. In practice adversarial training leads to low robust training
    loss. However, a rigorous explanation for why this happens under natural conditions is
    still missing. Recently a convergence theory for standard (non-adversarial) supervised
    training was developed by various groups for {\em very overparametrized} nets. It is
    unclear how to extend these results to adversarial training because of the min-max
    objective. Recently, a first step towards this direction was made by Gao et al. using
    tools from online learning, but they require the width of the net to be
    \emph{exponential} in input dimension $d$, and with an unnatural activation function.
    Our work proves convergence to low robust training loss for \emph{polynomial} width
    instead of exponential, under natural assumptions and with the ReLU activation. Key
    element of our proof is showing that ReLU networks near initialization can approximate
    the step function, which may be of independent interest.

arora2020theory-of-deep:
  title: "Theory of deep learning"
  link: "https://web.archive.org/web/20250630153732/https://www.cs.princeton.edu/~arora/TheoryDL.pdf"
  venue: "Manuscript"
  authors: "Raman Arora, Sanjeev Arora, Joan Bruna, Nadav Cohen, Simon Du, Rong Ge, Suriya Gunasekar, Chi Jin, Jason Lee, Tengyu Ma, Behnam Neyshabur, Zhao Song"
  year: 2020

######################### 2019 #########################
li2019enhanced-convolutional-neural:
  title: "Enhanced Convolutional Neural Tangent Kernels"
  link: "https://arxiv.org/abs/1911.00809"
  arxiv: "1911.00809"
  venue: "Preprint"
  authors: "Zhiyuan Li, Ruosong Wang, Dingli Yu, Simon S Du, Wei Hu, Ruslan Salakhutdinov, Sanjeev Arora"
  year: 2019
  abstract: >-
    Recent research shows that for training with $\ell_2$ loss, convolutional neural
    networks (CNNs) whose width (number of channels in convolutional layers) goes to
    infinity correspond to regression with respect to the CNN Gaussian Process kernel (CNN-
    GP) if only the last layer is trained, and correspond to regression with respect to the
    Convolutional Neural Tangent Kernel (CNTK) if all layers are trained. An exact algorithm
    to compute CNTK (Arora et al., 2019) yielded the finding that classification accuracy of
    CNTK on CIFAR-10 is within 6-7% of that of that of the corresponding CNN architecture
    (best figure being around 78%) which is interesting performance for a fixed kernel. Here
    we show how to significantly enhance the performance of these kernels using two ideas.
    (1) Modifying the kernel using a new operation called Local Average Pooling (LAP) which
    preserves efficient computability of the kernel and inherits the spirit of standard data
    augmentation using pixel shifts. Earlier papers were unable to incorporate naive data
    augmentation because of the quadratic training cost of kernel regression. This idea is
    inspired by Global Average Pooling (GAP), which we show for CNN-GP and CNTK is
    equivalent to full translation data augmentation. (2) Representing the input image using
    a pre-processing technique proposed by Coates et al. (2011), which uses a single
    convolutional layer composed of random image patches. On CIFAR-10, the resulting kernel,
    CNN-GP with LAP and horizontal flip data augmentation, achieves 89% accuracy, matching
    the performance of AlexNet (Krizhevsky et al., 2012). Note that this is the best such
    result we know of for a classifier that is not a trained neural network. Similar
    improvements are obtained for Fashion-MNIST.

li2019an-exponential-learning:
  title: "An Exponential Learning Rate Schedule for Deep Learning"
  link: "https://arxiv.org/abs/1910.07454"
  arxiv: "1910.07454"
  venue: "ICLR 2021"
  authors: "Zhiyuan Li, Sanjeev Arora"
  year: 2019
  abstract: >-
    Intriguing empirical evidence exists that deep learning can work well with
    exoticschedules for varying the learning rate. This paper suggests that the phenomenon
    may be due to Batch Normalization or BN, which is ubiquitous and provides benefits in
    optimization and generalization across all standard architectures. The following new
    results are shown about BN with weight decay and momentum (in other words, the typical
    use case which was not considered in earlier theoretical analyses of stand-alone BN. 1.
    Training can be done using SGD with momentum and an exponentially increasing learning
    rate schedule, i.e., learning rate increases by some $(1 +α)$ factor in every epoch for
    some $α>0$. (Precise statement in the paper.) To the best of our knowledge this is the
    first time such a rate schedule has been successfully used, let alone for highly
    successful architectures. As expected, such training rapidly blows up network weights,
    but the net stays well-behaved due to normalization. 2. Mathematical explanation of the
    success of the above rate schedule: a rigorous proof that it is equivalent to the
    standard setting of BN + SGD + StandardRate Tuning + Weight Decay + Momentum. This
    equivalence holds for other normalization layers as well, Group Normalization,
    LayerNormalization, Instance Norm, etc. 3. A worked-out toy example illustrating the
    above linkage of hyper-parameters. Using either weight decay or BN alone reaches global
    minimum, but convergence fails when both are used.

arora2019harnessing-the-power:
  title: "Harnessing the Power of Infinitely Wide Deep Nets on Small-data Tasks"
  link: "https://arxiv.org/abs/1910.01663"
  arxiv: "1910.01663"
  venue: "ICLR 2020 (Spotlight)"
  authors: "Sanjeev Arora, Simon S Du, Zhiyuan Li, Ruslan Salakhutdinov, Ruosong Wang, Dingli Yu"
  year: 2019
  code: "https://github.com/LeoYu/neural-tangent-kernel-UCI"
  abstract: >-
    Recent research shows that the following two models are equivalent: (a) infinitely wide
    neural networks (NNs) trained under l2 loss by gradient descent with infinitesimally
    small learning rate (b) kernel regression with respect to so-called Neural Tangent
    Kernels (NTKs) (Jacot et al., 2018). An efficient algorithm to compute the NTK, as well
    as its convolutional counterparts, appears in Arora et al. (2019a), which allowed
    studying performance of infinitely wide nets on datasets like CIFAR-10. However, super-
    quadratic running time of kernel methods makes them best suited for small-data tasks. We
    report results suggesting neural tangent kernels perform strongly on low-data tasks. 1.
    On a standard testbed of classification/regression tasks from the UCI database, NTK SVM
    beats the previous gold standard, Random Forests (RF), and also the corresponding finite
    nets. 2. On CIFAR-10 with 10 - 640 training samples, Convolutional NTK consistently
    beats ResNet-34 by 1% - 3%. 3. On VOC07 testbed for few-shot image classification tasks
    on ImageNet with transfer learning (Goyal et al., 2019), replacing the linear SVM
    currently used with a Convolutional NTK SVM consistently improves performance. 4.
    Comparing the performance of NTK with the finite-width net it was derived from, NTK
    behavior starts at lower net widths than suggested by theoretical analysis(Arora et al.,
    2019a). NTK's efficacy may trace to lower variance of output.

kuditipudi2019explaining-landscape-connectivity:
  title: "Explaining Landscape Connectivity of Low-cost Solutions for Multilayer Nets"
  link: "https://proceedings.neurips.cc/paper/2019/hash/46a4378f835dc8040c8057beb6a2da52-Abstract.html"
  arxiv: "1906.06247"
  venue: "NeurIPS 2019"
  authors: "Rohith Kuditipudi, Xiang Wang, Holden Lee, Yi Zhang, Zhiyuan Li, Wei Hu, Sanjeev Arora, Rong Ge"
  year: 2019
  abstract: >-
    Mode connectivity is a surprising phenomenon in the loss landscape of deep nets. Optima
    -- at least those discovered by gradient-based optimization -- turn out to be connected
    by simple paths on which the loss function is almost constant. Often, these paths can be
    chosen to be piece-wise linear, with as few as two segments. We give mathematical
    explanations for this phenomenon, assuming generic properties (such as dropout stability
    and noise stability) of well-trained deep nets, which have previously been identified as
    part of understanding the generalization properties of deep nets. Our explanation holds
    for realistic multilayer nets, and experiments are presented to verify the theory.

arora2019implicit-regularization-in:
  title: "Implicit Regularization in Deep Matrix Factorization"
  link: "https://proceedings.neurips.cc/paper/2019/hash/c0c783b5fc0d7d808f1d14a6e9c8280d-Abstract.html"
  arxiv: "1905.13655"
  venue: "NeurIPS 2019"
  authors: "Sanjeev Arora, Nadav Cohen, Wei Hu, Yuping Luo"
  year: 2019
  abstract: >-
    Efforts to understand the generalization mystery in deep learning have led to the belief
    that gradient-based optimization induces a form of implicit regularization, a bias
    towards models of low "complexity." We study the implicit regularization of gradient
    descent over deep linear neural networks for matrix completion and sensing, a model
    referred to as deep matrix factorization. Our first finding, supported by theory and
    experiments, is that adding depth to a matrix factorization enhances an implicit
    tendency towards low-rank solutions, oftentimes leading to more accurate recovery.
    Secondly, we present theoretical and empirical arguments questioning a nascent view by
    which implicit regularization in matrix factorization can be captured using simple
    mathematical norms. Our results point to the possibility that the language of standard
    regularizers may not be rich enough to fully encompass the implicit regularization
    brought forth by gradient-based optimization.

gupta2019a-simple-saliency:
  title: "A Simple Saliency Method That Passes the Sanity Checks"
  link: "https://arxiv.org/abs/1905.12152"
  arxiv: "1905.12152"
  venue: "Preprint"
  authors: "Arushi Gupta, Sanjeev Arora"
  year: 2019
  abstract: >-
    There is great interest in "saliency methods" (also called "attribution methods"), which
    give "explanations" for a deep net's decision, by assigning a "score" to each
    feature/pixel in the input. Their design usually involves credit-assignment via the
    gradient of the output with respect to input. Recently Adebayo et al. [arXiv:1810.03292]
    questioned the validity of many of these methods since they do not pass simple *sanity
    checks* which test whether the scores shift/vanish when layers of the trained net are
    randomized, or when the net is retrained using random labels for inputs. We propose a
    simple fix to existing saliency methods that helps them pass sanity checks, which we
    call "competition for pixels". This involves computing saliency maps for all possible
    labels in the classification task, and using a simple competition among them to identify
    and remove less relevant pixels from the map. The simplest variant of this is
    "Competitive Gradient $\odot$ Input (CGI)": it is efficient, requires no additional
    training, and uses only the input and gradient. Some theoretical justification is
    provided for it (especially for ReLU networks) and its performance is empirically
    demonstrated.

arora2019on-exact-computation:
  title: "On Exact Computation with an Infinitely Wide Neural Net"
  link: "https://arxiv.org/abs/1904.11955"
  arxiv: "1904.11955"
  venue: "NeurIPS 2019"
  authors: "Sanjeev Arora, Simon S Du, Wei Hu, Zhiyuan Li, Ruslan Salakhutdinov, Ruosong Wang"
  year: 2019
  code: "https://github.com/ruosongwang/cntk"
  abstract: >-
    How well does a classic deep net architecture like AlexNet or VGG19 classify on a
    standard dataset such as CIFAR-10 when its width --- namely, number of channels in
    convolutional layers, and number of nodes in fully-connected internal layers --- is
    allowed to increase to infinity? Such questions have come to the forefront in the quest
    to theoretically understand deep learning and its mysteries about optimization and
    generalization. They also connect deep learning to notions such as Gaussian processes
    and kernels. A recent paper [Jacot et al., 2018] introduced the Neural Tangent Kernel
    (NTK) which captures the behavior of fully-connected deep nets in the infinite width
    limit trained by gradient descent; this object was implicit in some other recent papers.
    An attraction of such ideas is that a pure kernel-based method is used to capture the
    power of a fully-trained deep net of infinite width. The current paper gives the first
    efficient exact algorithm for computing the extension of NTK to convolutional neural
    nets, which we call Convolutional NTK (CNTK), as well as an efficient GPU implementation
    of this algorithm. This results in a significant new benchmark for the performance of a
    pure kernel-based method on CIFAR-10, being $10\%$ higher than the methods reported in
    [Novak et al., 2019], and only $6\%$ lower than the performance of the corresponding
    finite deep net architecture (once batch normalization, etc. are turned off).
    Theoretically, we also give the first non-asymptotic proof showing that a fully-trained
    sufficiently wide net is indeed equivalent to the kernel regression predictor using NTK.

saunshi2019a-theoretical-analysis:
  title: "A Theoretical Analysis of Contrastive Unsupervised Representation Learning"
  link: "https://proceedings.mlr.press/v97/saunshi19a"
  arxiv: "1902.09229"
  venue: "ICML 2019"
  authors: "Nikunj Saunshi, Orestis Plevrakis, Sanjeev Arora, Mikhail Khodak, Hrishikesh Khandeparkar"
  year: 2019
  abstract: >-
    Recent empirical works have successfully used unlabeled data to learn feature
    representations that are broadly useful in downstream classification tasks. Several of
    these methods are reminiscent of the well-known word2vec embedding algorithm: leveraging
    availability of pairs of semantically "similar" data points and "negative samples," the
    learner forces the inner product of representations of similar pairs with each other to
    be higher on average than with negative samples. The current paper uses the term
    contrastive learning for such algorithms and presents a theoretical framework for
    analyzing them by introducing latent classes and hypothesizing that semantically similar
    points are sampled from the same latent class. This framework allows us to show provable
    guarantees on the performance of the learned representations on the average
    classification task that is comprised of a subset of the same set of latent classes. Our
    generalization bound also shows that learned representations can reduce (labeled) sample
    complexity on downstream tasks. We conduct controlled experiments in both the text and
    image domains to support the theory.

arora2019fine-grained-analysis-of:
  title: "Fine-Grained Analysis of Optimization and Generalization for Overparameterized Two-Layer Neural Networks"
  link: "https://proceedings.mlr.press/v97/arora19a.html"
  arxiv: "1901.08584"
  venue: "ICML 2019"
  authors: "Sanjeev Arora, Simon Du, Wei Hu, Zhiyuan Li, Ruosong Wang"
  year: 2019
  abstract: >-
    Recent works have cast some light on the mystery of why deep nets fit any data and
    generalize despite being very overparametrized. This paper analyzes training and
    generalization for a simple 2-layer ReLU net with random initialization, and provides
    the following improvements over recent works: (i) Using a tighter characterization of
    training speed than recent papers, an explanation for why training a neural net with
    random labels leads to slower training, as originally observed in [Zhang et al.
    ICLR'17]. (ii) Generalization bound independent of network size, using a data-dependent
    complexity measure. Our measure distinguishes clearly between random labels and true
    labels on MNIST and CIFAR, as shown by experiments. Moreover, recent papers require
    sample complexity to increase (slowly) with the size, while our sample complexity is
    completely independent of the network size. (iii) Learnability of a broad class of
    smooth functions by 2-layer ReLU nets trained via gradient descent. The key idea is to
    track dynamics of training and generalization via properties of a related kernel.

######################### 2018 #########################
arora2018theoretical-analysis-of:
  title: "Theoretical Analysis of Auto Rate-Tuning by Batch Normalization"
  link: "https://arxiv.org/abs/1812.03981"
  arxiv: "1812.03981"
  venue: "Preprint"
  authors: "Sanjeev Arora, Zhiyuan Li, Kaifeng Lyu"
  year: 2018
  abstract: >-
    Batch Normalization (BN) has become a cornerstone of deep learning across diverse
    architectures, appearing to help optimization as well as generalization. While the idea
    makes intuitive sense, theoretical analysis of its effectiveness has been lacking. Here
    theoretical support is provided for one of its conjectured properties, namely, the
    ability to allow gradient descent to succeed with less tuning of learning rates. It is
    shown that even if we fix the learning rate of scale-invariant parameters (e.g., weights
    of each layer with BN) to a constant (say, $0.3$), gradient descent still approaches a
    stationary point (i.e., a solution where gradient is zero) in the rate of $T^{-1/2}$ in
    $T$ iterations, asymptotically matching the best bound for gradient descent with well-
    tuned learning rates. A similar result with convergence rate $T^{-1/4}$ is also shown
    for stochastic gradient descent.

arora2018a-convergence-analysis:
  title: "A Convergence Analysis of Gradient Descent for Deep Linear Neural Networks"
  link: "https://arxiv.org/abs/1810.02281"
  arxiv: "1810.02281"
  venue: "ICLR 2019"
  authors: "Sanjeev Arora, Nadav Cohen, Noah Golowich, Wei Hu"
  year: 2018
  abstract: >-
    We analyze speed of convergence to global optimum for gradient descent training a deep
    linear neural network (parameterized as $x \mapsto W_N W_{N-1} \cdots W_1 x$) by
    minimizing the $\ell_2$ loss over whitened data. Convergence at a linear rate is
    guaranteed when the following hold: (i) dimensions of hidden layers are at least the
    minimum of the input and output dimensions; (ii) weight matrices at initialization are
    approximately balanced; and (iii) the initial loss is smaller than the loss of any rank-
    deficient solution. The assumptions on initialization (conditions (ii) and (iii)) are
    necessary, in the sense that violating any one of them may lead to convergence failure.
    Moreover, in the important case of output dimension 1, i.e. scalar regression, they are
    met, and thus convergence to global optimum holds, with constant probability under a
    random initialization scheme. Our results significantly extend previous analyses, e.g.,
    of deep linear residual networks (Bartlett et al., 2018).

arora2018mathematics-of-machine:
  title: "Mathematics of machine learning: an introduction"
  link: "https://www.worldscientific.com/doi/abs/10.1142/9789813272880_0017"
  venue: "ICM 2018"
  authors: "Sanjeev Arora"
  year: 2018

kalai2018icm-2018-lecture:
  title: "ICM 2018 Lecture Sampler"
  link: "https://www.ams.org/journals/notices/201807/rnoti-p781.pdf"
  venue: "Notices of the AMS"
  authors: "Gil Kalai, Sanjeev Arora, Catherine Goldstein, Sylvia Serfaty, Gregory F Lawler"
  year: 2018

khodak2018a-la-carte:
  title: "A La Carte Embedding: Cheap but Effective Induction of Semantic Feature Vectors"
  link: "https://arxiv.org/abs/1805.05388"
  arxiv: "1805.05388"
  venue: "ACL 2018"
  authors: "Mikhail Khodak, Nikunj Saunshi, Yingyu Liang, Tengyu Ma, Brandon Stewart, Sanjeev Arora"
  year: 2018
  abstract: >-
    Motivations like domain adaptation, transfer learning, and feature learning have fueled
    interest in inducing embeddings for rare or unseen words, n-grams, synsets, and other
    textual features. This paper introduces a la carte embedding, a simple and general
    alternative to the usual word2vec-based approaches for building such representations
    that is based upon recent theoretical results for GloVe-like embeddings. Our method
    relies mainly on a linear transformation that is efficiently learnable using pretrained
    word vectors and linear regression. This transform is applicable on the fly in the
    future when a new text feature or rare word is encountered, even if only a single usage
    example is available. We introduce a new dataset showing how the a la carte method
    requires fewer examples of words in context to learn high-quality embeddings and we
    obtain state-of-the-art results on a nonce task and some unsupervised document
    classification tasks.

arora2018toward-theoretical-understanding:
  title: "Toward theoretical understanding of deep learning"
  link: "https://www.icts.res.in/sites/default/files/machinelearning2019-Sanjeev-Arora-Lecture2.pdf"
  venue: "Harvard Ahlfors Lecture #2, 2018"
  authors: "Sanjeev Arora"
  year: 2018

arora2018learning-topic-models--provably:
  title: "Learning topic models--provably and efficiently"
  link: "https://dl.acm.org/doi/10.1145/3186262"
  venue: "Communications of the ACM"
  authors: "Sanjeev Arora, Rong Ge, Yoni Halpern, David Mimno, Ankur Moitra, David Sontag, Yichen Wu, Michael Zhu"
  year: 2018

arora2018an-analysis-of:
  title: "An Analysis of the t-SNE Algorithm for Data Visualization"
  link: "https://proceedings.mlr.press/v75/arora18a.html"
  arxiv: "1803.01768"
  venue: "COLT 2018"
  authors: "Sanjeev Arora, Wei Hu, Pravesh K Kothari"
  year: 2018
  abstract: >-
    A first line of attack in exploratory data analysis is data visualization, i.e.,
    generating a 2-dimensional representation of data that makes clusters of similar points
    visually identifiable. Standard Johnson-Lindenstrauss dimensionality reduction does not
    produce data visualizations. The t-SNE heuristic of van der Maaten and Hinton, which is
    based on non-convex optimization, has become the de facto standard for visualization in
    a wide range of applications. This work gives a formal framework for the problem of data
    visualization - finding a 2-dimensional embedding of clusterable data that correctly
    separates individual clusters to make them visually identifiable. We then give a
    rigorous analysis of the performance of t-SNE under a natural, deterministic condition
    on the "ground-truth" clusters (similar to conditions assumed in earlier analyses of
    clustering) in the underlying data. These are the first provable guarantees on t-SNE for
    constructing good data visualizations. We show that our deterministic condition is
    satisfied by considerably general probabilistic generative models for clusterable data
    such as mixtures of well-separated log-concave distributions. Finally, we give
    theoretical evidence that t-SNE provably succeeds in partially recovering cluster
    structure even when the above deterministic condition is not met.

arora2018on-the-optimization:
  title: "On the Optimization of Deep Networks: Implicit Acceleration by Overparameterization"
  link: "https://proceedings.mlr.press/v80/arora18a.html"
  arxiv: "1802.06509"
  venue: "ICML 2018"
  authors: "Sanjeev Arora, Nadav Cohen, Elad Hazan"
  year: 2018
  abstract: >-
    Conventional wisdom in deep learning states that increasing depth improves
    expressiveness but complicates optimization. This paper suggests that, sometimes,
    increasing depth can speed up optimization. The effect of depth on optimization is
    decoupled from expressiveness by focusing on settings where additional layers amount to
    overparameterization - linear neural networks, a well-studied model. Theoretical
    analysis, as well as experiments, show that here depth acts as a preconditioner which
    may accelerate convergence. Even on simple convex problems such as linear regression
    with $\ell_p$ loss, $p>2$, gradient descent can benefit from transitioning to a non-
    convex overparameterized objective, more than it would from some common acceleration
    schemes. We also prove that it is mathematically impossible to obtain the acceleration
    effect of overparametrization via gradients of any regularizer.

arora2018stronger-generalization-bounds:
  title: "Stronger Generalization Bounds for Deep Nets via a Compression Approach"
  link: "https://proceedings.mlr.press/v80/arora18b.html"
  arxiv: "1802.05296"
  venue: "ICML 2018"
  authors: "Sanjeev Arora, Rong Ge, Behnam Neyshabur, Yi Zhang"
  year: 2018
  abstract: >-
    Deep nets generalize well despite having more parameters than the number of training
    samples. Recent works try to give an explanation using PAC-Bayes and Margin-based
    analyses, but do not as yet result in sample complexity bounds better than naive
    parameter counting. The current paper shows generalization bounds that're orders of
    magnitude better in practice. These rely upon new succinct reparametrizations of the
    trained net --- a compression that is explicit and efficient. These yield generalization
    bounds via a simple compression-based framework introduced here. Our results also
    provide some theoretical justification for widespread empirical success in compressing
    deep nets. Analysis of correctness of our compression relies upon some newly identified
    \textquotedblleft noise stability\textquotedblright properties of trained deep nets,
    which are also experimentally verified. The study of these properties and resulting
    generalization bounds are also extended to convolutional nets, which had eluded earlier
    attempts on proving generalization.

arora2018towards-provable-control:
  title: "Towards Provable Control for Unknown Linear Dynamical Systems"
  link: "https://openreview.net/forum?id=HJGuXK1vM"
  venue: "ICLR 2018 Workshop"
  authors: "Sanjeev Arora, Elad Hazan, Holden Lee, Karan Singh, Cyril Zhang, Yi Zhang"
  year: 2018

######################### 2017 #########################
arora2017theoretical-limitations-of:
  title: "Theoretical limitations of Encoder-Decoder GAN architectures"
  link: "https://arxiv.org/abs/1711.02651"
  arxiv: "1711.02651"
  venue: "Preprint"
  authors: "Sanjeev Arora, Andrej Risteski, Yi Zhang"
  year: 2017
  abstract: >-
    Encoder-decoder GANs architectures (e.g., BiGAN and ALI) seek to add an inference
    mechanism to the GANs setup, consisting of a small encoder deep net that maps data-
    points to their succinct encodings. The intuition is that being forced to train an
    encoder alongside the usual generator forces the system to learn meaningful mappings
    from the code to the data-point and vice-versa, which should improve the learning of the
    target distribution and ameliorate mode-collapse. It should also yield meaningful codes
    that are useful as features for downstream tasks. The current paper shows rigorously
    that even on real-life distributions of images, the encode-decoder GAN training
    objectives (a) cannot prevent mode collapse; i.e. the objective can be near-optimal even
    when the generated distribution has low and finite support (b) cannot prevent learning
    meaningless codes for data -- essentially white noise. Thus if encoder-decoder GANs do
    indeed work then it must be due to reasons as yet not understood, since the training
    objective can be low even for meaningless solutions.

adewale2017pixie-a-social:
  title: "Pixie: a social chatbot"
  link: "http://www.courses.mmeteer.com/Papers/Alexa_prize/pixie.pdf"
  venue: "Alexa prize proceedings"
  authors: "Oluwatosin Adewale, Alex Beatson, Davit Buniatyan, Jason Ge, Mikhail Khodak, Holden Lee, Niranjani Prasad, Nikunj Saunshi, Ari Seff, Karan Singh, Daniel Suo, Cyril Zhang, Sanjeev Arora"
  year: 2017

arora2018do-gans-learn:
  title: "Do GANs learn the distribution? Some Theory and Empirics"
  link: "https://openreview.net/forum?id=BJehNfW0-"
  venue: "ICLR 2018"
  authors: "Sanjeev Arora, Andrej Risteski, Yi Zhang"
  year: 2017

arora2018a-compressed-sensing:
  title: "A Compressed Sensing View of Unsupervised Text Embeddings, Bag-of-n-Grams, and LSTMs"
  link: "https://openreview.net/forum?id=B1e5ef-C-"
  venue: "ICLR 2018"
  authors: "Sanjeev Arora, Mikhail Khodak, Nikunj Saunshi, Kiran Vodrahalli"
  year: 2017

arora2017do-gans-actually:
  title: "Do GANs actually learn the distribution? An empirical study"
  link: "https://arxiv.org/abs/1706.08224"
  arxiv: "1706.08224"
  venue: "Preprint"
  authors: "Sanjeev Arora, Yi Zhang"
  year: 2017
  abstract: >-
    Do GANS (Generative Adversarial Nets) actually learn the target distribution? The
    foundational paper of (Goodfellow et al 2014) suggested they do, if they were given
    sufficiently large deep nets, sample size, and computation time. A recent theoretical
    analysis in Arora et al (to appear at ICML 2017) raised doubts whether the same holds
    when discriminator has finite size. It showed that the training objective can approach
    its optimum value even if the generated distribution has very low support ---in other
    words, the training objective is unable to prevent mode collapse. The current note
    reports experiments suggesting that such problems are not merely theoretical. It
    presents empirical evidence that well-known GANs approaches do learn distributions of
    fairly low support, and thus presumably are not learning the target distribution. The
    main technical contribution is a new proposed test, based upon the famous birthday
    paradox, for estimating the support size of the generated distribution.

arora2017provable-benefits-of:
  title: "Provable benefits of representation learning"
  link: "https://arxiv.org/abs/1706.04601"
  arxiv: "1706.04601"
  venue: "Preprint"
  authors: "Sanjeev Arora, Andrej Risteski"
  year: 2017
  abstract: >-
    There is general consensus that learning representations is useful for a variety of
    reasons, e.g. efficient use of labeled data (semi-supervised learning), transfer
    learning and understanding hidden structure of data. Popular techniques for
    representation learning include clustering, manifold learning, kernel-learning,
    autoencoders, Boltzmann machines, etc. To study the relative merits of these techniques,
    it's essential to formalize the definition and goals of representation learning, so that
    they are all become instances of the same definition. This paper introduces such a
    formal framework that also formalizes the utility of learning the representation. It is
    related to previous Bayesian notions, but with some new twists. We show the usefulness
    of our framework by exhibiting simple and natural settings -- linear mixture models and
    loglinear models, where the power of representation learning can be formally shown. In
    these examples, representation learning can be performed provably and efficiently under
    plausible assumptions (despite being NP-hard), and furthermore: (i) it greatly reduces
    the need for labeled data (semi-supervised learning) and (ii) it allows solving
    classification tasks when simpler approaches like nearest neighbors require too much
    data (iii) it is more powerful than manifold learning methods.

khodak2017extending-and-improving:
  title: "Extending and Improving Wordnet via Unsupervised Word Embeddings"
  link: "https://arxiv.org/abs/1705.00217"
  arxiv: "1705.00217"
  venue: "Preprint"
  authors: "Mikhail Khodak, Andrej Risteski, Christiane Fellbaum, Sanjeev Arora"
  year: 2017
  abstract: >-
    This work presents an unsupervised approach for improving WordNet that builds upon
    recent advances in document and sense representation via distributional semantics. We
    apply our methods to construct Wordnets in French and Russian, languages which both lack
    good manual constructions.1 These are evaluated on two new 600-word test sets for word-
    to-synset matching and found to improve greatly upon synset recall, outperforming the
    best automated Wordnets in F-score. Our methods require very few linguistic resources,
    thus being applicable for Wordnet construction in low-resources languages, and may
    further be applied to sense clustering and other Wordnet improvements.

khodak2017automated-wordnet-construction:
  title: "Automated WordNet Construction Using Word Embeddings"
  link: "https://aclanthology.org/W17-1902/"
  venue: "Proceedings of the 1st Workshop on Sense, Concept and Entity Representations and their Applications"
  authors: "Mikhail Khodak, Andrej Risteski, Christiane Fellbaum, Sanjeev Arora"
  year: 2017

arora2017generalization-and-equilibrium:
  title: "Generalization and Equilibrium in Generative Adversarial Nets (GANs)"
  link: "https://proceedings.mlr.press/v70/arora17a.html"
  arxiv: "1703.00573"
  venue: "ICML 2017"
  authors: "Sanjeev Arora, Rong Ge, Yingyu Liang, Tengyu Ma, Yi Zhang"
  year: 2017
  abstract: >-
    We show that training of generative adversarial network (GAN) may not have good
    generalization properties; e.g., training may appear successful but the trained
    distribution may be far from target distribution in standard metrics. However,
    generalization does occur for a weaker metric called neural net distance. It is also
    shown that an approximate pure equilibrium exists in the discriminator/generator game
    for a special class of generators with natural training objectives when generator
    capacity and training set sizes are moderate. This existence of equilibrium inspires
    MIX+GAN protocol, which can be combined with any existing GAN training, and empirically
    shown to improve some of them.

lee2017on-the-ability:
  title: "On the Ability of Neural Nets to Express Distributions"
  link: "https://proceedings.mlr.press/v65/lee17a.html"
  arxiv: "1702.07028"
  venue: "COLT 2017"
  authors: "Holden Lee, Rong Ge, Tengyu Ma, Andrej Risteski, Sanjeev Arora"
  year: 2017
  abstract: >-
    Deep neural nets have caused a revolution in many classification tasks. A related
    ongoing revolution -- also theoretically not understood -- concerns their ability to
    serve as generative models for complicated types of data such as images and texts. These
    models are trained using ideas like variational autoencoders and Generative Adversarial
    Networks. We take a first cut at explaining the expressivity of multilayer nets by
    giving a sufficient criterion for a function to be approximable by a neural network with
    $n$ hidden layers. A key ingredient is Barron's Theorem \cite{Barron1993}, which gives a
    Fourier criterion for approximability of a function by a neural network with 1 hidden
    layer. We show that a composition of $n$ functions which satisfy certain Fourier
    conditions ("Barron functions") can be approximated by a $n+1$-layer neural network. For
    probability distributions, this translates into a criterion for a probability
    distribution to be approximable in Wasserstein distance -- a natural metric on
    probability distributions -- by a neural network applied to a fixed base distribution
    (e.g., multivariate gaussian). Building up recent lower bound work, we also give an
    example function that shows that composition of Barron functions is more expressive than
    Barron functions alone.

######################### 2016 #########################
arora2017provable-learning-of:
  title: "Provable learning of noisy-OR networks"
  link: "https://dl.acm.org/doi/abs/10.1145/3055399.3055482"
  arxiv: "1612.08795"
  venue: "STOC 2017"
  authors: "Sanjeev Arora, Rong Ge, Tengyu Ma, Andrej Risteski"
  year: 2016
  abstract: >-
    Many machine learning applications use latent variable models to explain structure in
    data, whereby visible variables (= coordinates of the given datapoint) are explained as
    a probabilistic function of some hidden variables. Finding parameters with the maximum
    likelihood is NP-hard even in very simple settings. In recent years, provably efficient
    algorithms were nevertheless developed for models with linear structures: topic models,
    mixture models, hidden markov models, etc. These algorithms use matrix or tensor
    decomposition, and make some reasonable assumptions about the parameters of the
    underlying model. But matrix or tensor decomposition seems of little use when the latent
    variable model has nonlinearities. The current paper shows how to make progress: tensor
    decomposition is applied for learning the single-layer {\em noisy or} network, which is
    a textbook example of a Bayes net, and used for example in the classic QMR-DT software
    for diagnosing which disease(s) a patient may have by observing the symptoms he/she
    exhibits. The technical novelty here, which should be useful in other settings in
    future, is analysis of tensor decomposition in presence of systematic error (i.e., where
    the noise/error is correlated with the signal, and doesn't decrease as number of samples
    goes to infinity). This requires rethinking all steps of tensor decomposition methods
    from the ground up. For simplicity our analysis is stated assuming that the network
    parameters were chosen from a probability distribution but the method seems more
    generally applicable.

arora2017a-simple-but:
  title: "A Simple but Tough-to-Beat Baseline for Sentence Embeddings"
  link: "https://openreview.net/forum?id=SyK00v5xx"
  venue: "ICLR 2017"
  authors: "Sanjeev Arora, Yingyu Liang, Tengyu Ma"
  year: 2016

vodrahalli2018mapping-between-fmri:
  title: "Mapping between fMRI responses to movies and their natural language annotations"
  link: "https://www.sciencedirect.com/science/article/pii/S1053811917305128"
  arxiv: "1610.03914"
  venue: "NeuroImage"
  authors: "Kiran Vodrahalli, Po-Hsuan Chen, Yingyu Liang, Christopher Baldassano, Janice Chen, Esther Yong, Christopher Honey, Uri Hasson, Peter Ramadge, Kenneth A Norman, Sanjeev Arora"
  year: 2016
  abstract: >-
    Several research groups have shown how to correlate fMRI responses to the meanings of
    presented stimuli. This paper presents new methods for doing so when only a natural
    language annotation is available as the description of the stimulus. We study fMRI data
    gathered from subjects watching an episode of BBCs Sherlock [1], and learn bidirectional
    mappings between fMRI responses and natural language representations. We show how to
    leverage data from multiple subjects watching the same movie to improve the accuracy of
    the mappings, allowing us to succeed at a scene classification task with 72% accuracy
    (random guessing would give 4%) and at a scene ranking task with average rank in the top
    4% (random guessing would give 50%). The key ingredients are (a) the use of the Shared
    Response Model (SRM) and its variant SRM-ICA [2, 3] to aggregate fMRI data from multiple
    subjects, both of which are shown to be superior to standard PCA in producing low-
    dimensional representations for the tasks in this paper; (b) a sentence embedding
    technique adapted from the natural language processing (NLP) literature [4] that
    produces semantic vector representation of the annotations; (c) using previous timestep
    information in the featurization of the predictor data.

vodrahalli2016mapping-between-natural:
  title: "Mapping between natural movie fMRI responses and word-sequence representations"
  link: "https://www.researchgate.net/profile/Peter-Ramadge/publication/309131818_Mapping_Between_Natural_Movie_fMRI_Responses_and_Word-Sequence_Representations/links/582b5a0708aef19cb806b6ae/Mapping-Between-Natural-Movie-fMRI-Responses-and-Word-Sequence-Representations.pdf"
  venue: "Preprint"
  authors: "Kiran Vodrahalli, Po-Hsuan Chen, Yingyu Liang, Janice Chen, Esther Yong, Christopher Honey, Peter Ramadge, Ken Norman, Sanjeev Arora"
  year: 2016

arora2016provable-algorithms-for:
  title: "Provable algorithms for inference in topic models"
  link: "https://proceedings.mlr.press/v48/arorab16.html"
  arxiv: "1605.08491"
  venue: "ICML 2016"
  authors: "Sanjeev Arora, Rong Ge, Frederic Koehler, Tengyu Ma, Ankur Moitra"
  year: 2016
  abstract: >-
    Recently, there has been considerable progress on designing algorithms with provable
    guarantees -- typically using linear algebraic methods -- for parameter learning in
    latent variable models. But designing provable algorithms for inference has proven to be
    more challenging. Here we take a first step towards provable inference in topic models.
    We leverage a property of topic models that enables us to construct simple linear
    estimators for the unknown topic proportions that have small variance, and consequently
    can work with short documents. Our estimators also correspond to finding an estimate
    around which the posterior is well-concentrated. We show lower bounds that for shorter
    documents it can be information theoretically impossible to find the hidden topics.
    Finally, we give empirical results that demonstrate that our algorithm works on
    realistic topic models. It yields good solutions on synthetic data and runs in time
    comparable to a {\em single} iteration of Gibbs sampling.

arora2018linear-algebraic-structure:
  title: "Linear Algebraic Structure of Word Senses, with Applications to Polysemy "
  link: "https://direct.mit.edu/tacl/article-abstract/doi/10.1162/tacl_a_00034/43451"
  arxiv: "1601.03764"
  venue: "Transactions of the Association for Computational Linguistics"
  authors: "Sanjeev Arora, Yuanzhi Li, Yingyu Liang, Tengyu Ma, Andrej Risteski"
  year: 2016
  abstract: >-
    Word embeddings are ubiquitous in NLP and information retrieval, but it is unclear what
    they represent when the word is polysemous. Here it is shown that multiple word senses
    reside in linear superposition within the word embedding and simple sparse coding can
    recover vectors that approximately capture the senses. The success of our approach,
    which applies to several embedding methods, is mathematically explained using a variant
    of the random walk on discourses model (Arora et al., 2016). A novel aspect of our
    technique is that each extracted word sense is accompanied by one of about 2000
    "discourse atoms" that gives a succinct description of which other words co-occur with
    that word sense. Discourse atoms can be of independent interest, and make the method
    potentially more useful. Empirical tests are used to verify and support the theory.

######################### 2015 #########################
arora2015why-are-deep:
  title: "Why are deep nets reversible: A simple theory, with implications for training"
  link: "https://arxiv.org/abs/1511.05653"
  arxiv: "1511.05653"
  venue: "Preprint"
  authors: "Sanjeev Arora, Yingyu Liang, Tengyu Ma"
  year: 2015
  abstract: >-
    Generative models for deep learning are promising both to improve understanding of the
    model, and yield training methods requiring fewer labeled samples. Recent works use
    generative model approaches to produce the deep net's input given the value of a hidden
    layer several levels above. However, there is no accompanying "proof of correctness" for
    the generative model, showing that the feedforward deep net is the correct inference
    method for recovering the hidden layer given the input. Furthermore, these models are
    complicated. The current paper takes a more theoretical tack. It presents a very simple
    generative model for RELU deep nets, with the following characteristics: (i) The
    generative model is just the reverse of the feedforward net: if the forward
    transformation at a layer is $A$ then the reverse transformation is $A^T$. (This can be
    seen as an explanation of the old weight tying idea for denoising autoencoders.) (ii)
    Its correctness can be proven under a clean theoretical assumption: the edge weights in
    real-life deep nets behave like random numbers. Under this assumption ---which is
    experimentally tested on real-life nets like AlexNet--- it is formally proved that feed
    forward net is a correct inference method for recovering the hidden layer. The
    generative model suggests a simple modification for training: use the generative model
    to produce synthetic data with labels and include it in the training set. Experiments
    are shown to support this theory of random-like deep nets; and that it helps the
    training.

arora2015overcoming-intractability-in:
  title: "Overcoming Intractability in Unsupervised Learning (Invited Talk)"
  link: "https://drops.dagstuhl.de/entities/document/10.4230/LIPIcs.STACS.2015.1"
  venue: "STACS 2015"
  authors: "Sanjeev Arora"
  year: 2015

arora2015simple-efficient-and:
  title: "Simple, efficient, and neural algorithms for sparse coding"
  link: "https://proceedings.mlr.press/v40/Arora15.html"
  arxiv: "1503.00778"
  venue: "COLT 2015"
  authors: "Sanjeev Arora, Rong Ge, Tengyu Ma, Ankur Moitra"
  year: 2015
  abstract: >-
    Sparse coding is a basic task in many fields including signal processing, neuroscience
    and machine learning where the goal is to learn a basis that enables a sparse
    representation of a given set of data, if one exists. Its standard formulation is as a
    non-convex optimization problem which is solved in practice by heuristics based on
    alternating minimization. Re- cent work has resulted in several algorithms for sparse
    coding with provable guarantees, but somewhat surprisingly these are outperformed by the
    simple alternating minimization heuristics. Here we give a general framework for
    understanding alternating minimization which we leverage to analyze existing heuristics
    and to design new ones also with provable guarantees. Some of these algorithms seem
    implementable on simple neural architectures, which was the original motivation of
    Olshausen and Field (1997a) in introducing sparse coding. We also give the first
    efficient algorithm for sparse coding that works almost up to the information theoretic
    limit for sparse recovery on incoherent dictionaries. All previous algorithms that
    approached or surpassed this limit run in time exponential in some natural parameter.
    Finally, our algorithms improve upon the sample complexity of existing approaches. We
    believe that our analysis framework will have applications in other settings where
    simple iterative algorithms are used.

arora2016a-latent-variable:
  title: "A Latent Variable Model Approach to PMI-based Word Embeddings"
  link: "https://direct.mit.edu/tacl/article-abstract/doi/10.1162/tacl_a_00106/43373"
  arxiv: "1502.03520"
  venue: "Transactions of the Association for Computational Linguistics"
  authors: "Sanjeev Arora, Yuanzhi Li, Yingyu Liang, Tengyu Ma, Andrej Risteski"
  year: 2015
  abstract: >-
    Semantic word embeddings represent the meaning of a word via a vector, and are created
    by diverse methods. Many use nonlinear operations on co-occurrence statistics, and have
    hand-tuned hyperparameters and reweighting methods. This paper proposes a new generative
    model, a dynamic version of the log-linear topic model of~\citet{mnih2007three}. The
    methodological novelty is to use the prior to compute closed form expressions for word
    statistics. This provides a theoretical justification for nonlinear models like PMI,
    word2vec, and GloVe, as well as some hyperparameter choices. It also helps explain why
    low-dimensional semantic embeddings contain linear algebraic structure that allows
    solution of word analogies, as shown by~\citet{mikolov2013efficient} and many subsequent
    papers. Experimental support is provided for the generative model assumptions, the most
    important of which is that latent word vectors are fairly uniformly dispersed in space.

arora2015cos-521-a:
  title: "COS 521: A Graduate Course in Algorithm Design and Analysis"
  link: "https://www.cs.princeton.edu/courses/archive/fall14/cos521/main.pdf"
  venue: "Lecture notes"
  authors: "Sanjeev Arora"
  year: 2015

