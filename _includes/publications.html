<div class="publications">
    <ul>
        {% for hash in site.data.publications %}
            {% assign paper = hash[1] %}
            {% if paper.year == year %}
                <li>
                    <a href="{{ paper.link }}">{{ paper.title }}</a>.
                    <span style="color: var(--color-ink-subtle);">{{ paper.venue }}</span>
                    <span style="display:block; font-size:13px; color: var(--color-ink-subtle); margin-top:2px;">{{ paper.authors }}</span>
                </li>
            {% endif %}
        {% endfor %}
    </ul>
</div>
