<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#010102">

    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <div class="wrapper">
      <nav class="site-nav">
        <div class="site-nav__inner">
          <a class="site-nav__brand" href="{{ "/" | absolute_url }}">
            <span class="site-nav__brand-mark" aria-hidden="true"></span>
            <span>{{ site.title | default: site.github.repository_name }}</span>
          </a>
          <div class="site-nav__links">
            <a href="{{ "pages/team.html" | absolute_url }}">Team</a>
            <a href="{{ "pages/publications.html" | absolute_url }}">Publications</a>
            <a href="{{ "pages/blogs.html" | absolute_url }}">Blogs</a>
          </div>
        </div>
      </nav>

      <main class="site-main">
        {{ content }}
      </main>

      <footer class="site-footer">
        <div class="site-footer__inner">
          <span>© {{ site.time | date: '%Y' }} {{ site.title | default: site.github.repository_name }}.</span>
          <span>
            Princeton University · Department of Computer Science
          </span>
        </div>
      </footer>
    </div>
  </body>
</html>
